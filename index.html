        preview();
        function setMode(m) {
          root.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.mode === m)); });
          $('#pastePane', root).hidden = m !== 'paste';
          $('#manualPane', root).hidden = m !== 'manual';
          $('#csvPane', root).hidden = m !== 'csv';
        }
        root.onclick = function (ev) {
          var mb = ev.target.closest('[data-mode]');
          if (mb) { setMode(mb.dataset.mode); return; }
          var act = ev.target.closest('[data-sheet]');
          if (!act) return;
          ev.preventDefault();
          var a = act.dataset.sheet;
          if (a === 'cancel') closeSheet();
          if (a === 'edit') {
            if (last && last.kind === 'transaction') {
              $('#mMerchant', root).value = last.merchant;
              $('#mAmount', root).value = last.amount.toFixed(2);
              $('#mType', root).value = last.type;
            }
            setMode('manual');
          }
          if (a === 'save-paste' && last && last.kind === 'transaction') {
            addPasted(text.value.trim(), prefillDate || new Date(), last);
          }
          if (a === 'save-manual') {
            var amount = parseFloat($('#mAmount', root).value);
            if (!(amount > 0)) { toast('Indiquez un montant'); return; }
            var d = new Date($('#mDate', root).value);
            addManual({ amount: amount, currency: cur, merchant: $('#mMerchant', root).value.trim(), category: $('#mCategory', root).value, type: $('#mType', root).value,
              note: $('#mNote', root).value.trim(), date: (isNaN(d) ? new Date() : d).toISOString(), source: 'manual' });
          }
          if (a === 'csv-match') {
            var parsed = parseStatement($('#cText', root).value);
            var purchases = parsed.filter(function (l) { return !l.credit; });
            missing = parsed.filter(function (line) { return !matchStatementLine(line); });
            var missingPurchases = missing.filter(function (l) { return !l.credit; }).length;
            var credits = missing.length - missingPurchases;
            $('#cSummary', root).textContent = parsed.length
              ? (purchases.length - missingPurchases) + ' sur ' + purchases.length + ' déjà présents · ' + plural(missingPurchases, 'manquant') + (credits ? ' · ' + credits + ' paiement/crédit non ajouté' + (credits > 1 ? 's' : '') : '')
              : 'Aucune ligne reconnue (date, description, montant).';
            $('#cMissing', root).innerHTML = missing.map(function (l, i) {
              return '<label class="check"><input type="checkbox"' + (l.credit ? '' : ' checked') + ' data-csv="' + i + '"><span>' + esc(dfDay.format(l.date)) + ' · ' + esc(l.merchant) + ' · <b>' + (l.credit ? '+' : '') + esc(money(l.amount, cur)) + '</b>' +
                (l.credit ? ' <span class="pill">' + (l.kind === 'refund' ? 'remboursement' : 'paiement ou virement') + '</span>' : '') + '</span></label>';
            }).join('');
            $('#cAdd', root).hidden = !missing.length;
          }
          if (a === 'csv-add') {
            var chosen = [];
            root.querySelectorAll('[data-csv]').forEach(function (cb) { if (cb.checked) chosen.push(missing[+cb.dataset.csv]); });
            closeSheet();
            addStatementLines(chosen);
          }
        };
        if (!prefill) setTimeout(function () { text.focus(); }, 50);
      });
  }

  // Un texte collé passe par la capture du serveur (doublons, règles) et garde sa date.
  function addPasted(text, date, parsed) {
    var temp = tempTx(parsed, date, 'paste', text);
    closeSheet();
    jumpTo(date);
    mutate(function () { replaceTx(temp); }, 'add', { text: text, date: date.toISOString() }, function (res) {
      state.data.transactions = state.data.transactions.filter(function (x) { return x.id !== temp.id; });
      replaceTx(res.tx);
      toast(res.status === 'duplicate' ? 'Déjà présente : marquée comme doublon' : 'Ajoutée');
    });
  }
  function addManual(f) {
    var r = P.fromFields(f, { defaultCurrency: mainCurrency(), rules: state.data.rules });
    var temp = tempTx(r, new Date(f.date), f.source, '');
    temp.note = f.note || '';
    if (f.category) temp.category = f.category;
    closeSheet();
    jumpTo(temp._d);
    mutate(function () { replaceTx(temp); }, 'add', { tx: f }, function (res) {
      state.data.transactions = state.data.transactions.filter(function (x) { return x.id !== temp.id; });
      replaceTx(res.tx);
      toast(res.status === 'duplicate' ? 'Déjà présente : marquée comme doublon' : 'Ajoutée');
    });
  }
  function tempTx(r, date, source, raw) {
    return hydrate({ id: 'local-' + Date.now() + Math.random(), date: date.toISOString(), amount: P.signedAmount(r.amount, r.type), currency: r.currency, merchant: r.merchant,
      category: r.category, type: r.type, card: r.card || '', status: r.status === 'review' ? 'review' : 'ok', note: '', source: source, raw: raw, flags: '' });
  }
  function jumpTo(d) { if (!sameMonth(d, state.month)) state.month = startOfMonth(d); }

  // Relevé : chaque ligne doit avoir une date, un montant et une description. Les paiements de carte,
  // remboursements et dépôts (colonne Crédit, ou mots-clés) ne sont jamais proposés comme des achats.
  var CREDIT_WORDS = /\b(paiement|payment|merci|thank you|rembours\w*|refund|retour|cr[ée]dit|d[ée]p[oô]t|deposit|virement|transfer\w*|int[ée]r[êe]ts?|interest|reversal|annulation)\b/i;
  var NUM_CELL = /^[-+(]?\s*\$?\s*(?:\d{1,3}(?:[ ,.]\d{3})+|\d+)(?:[.,]\d{1,2})?\s*\$?\s*\)?\s*(?:CR|DR|DB)?$/i;
  function splitCells(line) {
    var cells = line.indexOf('\t') >= 0 ? line.split('\t') : line.indexOf(';') >= 0 ? line.split(';') : line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    return cells.map(function (c) { return c.replace(/^"|"$/g, '').trim(); });
  }
  function parseNumCell(c) {
    var negative = /^-|^\(|\)$|\bDR\b|\bDB\b/i.test(c) && !/\bCR\b/i.test(c);
    var credit = /\bCR\b/i.test(c);
    var v = P.toNumber(c.replace(/[^\d.,\s]/g, '').trim());
    return isFinite(v) && v > 0 ? { value: v, negative: negative, credit: credit } : null;
  }
  function parseStatement(text) {
    var lines = String(text || '').split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (!lines.length) return [];
    // En-tête : colonnes Débit / Crédit / Montant / Date / Description.
    var head = splitCells(lines[0]).map(function (c) { return P.fold(c); });
    var cols = { debit: -1, credit: -1, amount: -1, date: -1, desc: -1 };
    var hasHeader = !head.some(function (c) { return NUM_CELL.test(c); }) && head.some(function (c) { return /date|montant|amount|debit|credit|description|libell/.test(c); });
    if (hasHeader) {
      head.forEach(function (c, i) {
        if (cols.debit < 0 && /^debit/.test(c)) cols.debit = i;
        else if (cols.credit < 0 && /^credit/.test(c)) cols.credit = i;
        else if (cols.amount < 0 && /montant|amount|somme/.test(c)) cols.amount = i;
        else if (cols.date < 0 && /date/.test(c)) cols.date = i;
        else if (cols.desc < 0 && /description|libell|marchand|merchant|detail|transaction|nom|name/.test(c)) cols.desc = i;
      });
      lines = lines.slice(1);
    }
    // Ordre des dates a/b/aaaa : jour-mois si un premier nombre dépasse 12, mois-jour si un deuxième dépasse 12.
    var dayFirst = null;
    lines.forEach(function (line) {
      splitCells(line).forEach(function (c) {
        var m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(c);
        if (!m) return;
        if (+m[1] > 12) dayFirst = true;
        else if (+m[2] > 12 && dayFirst === null) dayFirst = false;
      });
    });
    if (dayFirst === null) dayFirst = false; // relevés canadiens : mois/jour/année le plus souvent
    var today = new Date();
    var out = [];
    lines.forEach(function (line) {
      var cells = splitCells(line);
      var date = null;
      var amount = null;
      var credit = false;
      var desc = [];
      cells.forEach(function (c, i) {
        if (!c) return;
        if (i === cols.desc) { desc.push(c); return; }
        var dm = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(c);
        var dm2 = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(c);
        if ((dm || dm2) && !date && (cols.date < 0 || i === cols.date)) {
          date = dm ? new Date(+dm[1], +dm[2] - 1, +dm[3]) : dayFirst ? new Date(+dm2[3], +dm2[2] - 1, +dm2[1]) : new Date(+dm2[3], +dm2[1] - 1, +dm2[2]);
          return;
        }
        if (NUM_CELL.test(c)) {
          var n = parseNumCell(c);
          if (!n) return;
          if (i === cols.credit) { if (amount === null) { amount = n.value; credit = true; } return; }
          if (i === cols.debit) { if (amount === null) amount = n.value; return; }
          if (cols.amount >= 0 && i !== cols.amount) return;
          if (amount === null) { amount = n.value; credit = n.credit; }
          return;
        }
        if (/[A-Za-zÀ-ÿ]{2,}/.test(c)) desc.push(c);
      });
      if (!date || isNaN(date) || !amount) return;
      if (date > new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1) || date < new Date(today.getFullYear() - 2, today.getMonth(), 1)) return;
      var merchant = desc.join(' ').replace(/\s+/g, ' ').trim().slice(0, 60);
      if (CREDIT_WORDS.test(merchant)) credit = true;
      out.push({ date: date, amount: amount, merchant: merchant, credit: credit, kind: credit ? (/rembours|refund|retour|reversal|annulation/i.test(merchant) ? 'refund' : 'transfer') : 'purchase' });
    });
    return out;
  }
  function matchStatementLine(line) {
    return state.data.transactions.some(function (t) {
      return t.status !== 'excluded' && Math.abs(Math.abs(t.amount) - line.amount) < 0.011 && Math.abs(t._d - line.date) < 4 * 86400000;
    });
  }
  function addStatementLines(lines) {
    if (!lines.length) return;
    var i = 0;
    var added = 0;
    var review = 0;
    (function next() {
      if (i >= lines.length) {
        toast(plural(added, 'transaction') + (added > 1 ? ' ajoutées' : ' ajoutée') + (review ? ' · ' + review + ' à vérifier (doublon possible)' : ''));
        return sync(true);
      }
      var l = lines[i++];
      var f = { amount: l.amount, currency: mainCurrency(), merchant: l.merchant, type: l.kind, date: new Date(l.date.getFullYear(), l.date.getMonth(), l.date.getDate(), 12).toISOString(), source: 'statement' };
      if (!live()) { replaceTx(tempTx(P.fromFields(f, { defaultCurrency: mainCurrency(), rules: state.data.rules }), new Date(f.date), 'statement', '')); added++; persist(); render(); return next(); }
      api('add', { tx: f }).then(function (res) { replaceTx(res.tx); if (res.status === 'review') review++; else added++; render(); }).catch(function (e) { toast('Non ajoutée : ' + e.message); }).then(next);
    })();
  }

  function openSettings() {
    var s = state.settings;
    var srv = state.data.settings || {};
    var c = checklist();
    openSheet(
      '<h2 id="sheetTitle">Réglages</h2>' +
      '<label class="field"><span>Adresse du script (ou lien de configuration)</span><input id="sUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(s.url) + '"></label>' +
      '<label class="field"><span>Jeton</span><input id="sToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(s.token) + '"></label>' +
      '<p class="hint">Collez ici le « Lien de configuration » de l’onglet Configuration de la feuille : l’adresse et le jeton se remplissent seuls. Ils restent sur cet appareil.</p>' +
      '<div class="btns" style="margin-bottom:14px"><button class="btn" data-sheet="test">Tester la connexion</button><span class="sub" id="sTest" aria-live="polite"></span></div>' +
      '<div id="sConnected"' + (connected() ? '' : ' hidden') + '>' +
      '<h3>iPhone</h3>' +
      (!standalone && !isIOS ? '<p class="sub" style="margin:0 0 8px">Pour passer cette page à l’iPhone : scannez ce code avec l’appareil photo. Il contient votre jeton : ne le partagez pas.</p><div class="qr" id="sQr"></div>' : '') +
      '<div class="btns" style="margin-bottom:12px"><button class="btn small" data-sheet="copy-setup">Copier le lien de configuration</button><span class="sub">Pour l’icône de l’écran d’accueil ou un autre appareil.</span></div>' +
      '<div class="field"><span>Lien du raccourci (action « Obtenir le contenu de l’URL »)</span>' +
      '<div class="copyrow"><input id="sShortcut" readonly aria-label="Lien du raccourci" value="' + esc(shortcutUrl()) + '"><button class="btn" data-sheet="copy-shortcut">Copier le lien du raccourci</button></div></div>' +
      '<p class="hint">Ce lien ne peut qu’ajouter des notifications. ' + (c.shortcut ? 'Raccourci relié ✓' : 'Pas encore reçu de test ni de notification.') + '</p>' +
      '<h3>Budget et courriels</h3>' +
      '<div class="two"><label class="field"><span>Budget mensuel</span><input id="sBudget" type="number" inputmode="decimal" min="0" step="10" placeholder="Aucun" value="' + (budget() || '') + '"></label>' +
      '<label class="field"><span>Devise</span><select id="sCurrency">' + options(['CAD', 'USD', 'EUR', 'GBP', 'CHF'].indexOf(mainCurrency()) >= 0 ? ['CAD', 'USD', 'EUR', 'GBP', 'CHF'] : [mainCurrency(), 'CAD', 'USD', 'EUR'], mainCurrency()) + '</select></label></div>' +
      '<p class="hint">La devise est aussi ce qu’un « $ » seul veut dire dans une notification.</p>' +
      '<label class="check"><input type="checkbox" id="sDigest"' + (srv.digest !== false ? ' checked' : '') + '><span>Résumé de la semaine par courriel, le lundi matin</span></label>' +
      '<label class="check"><input type="checkbox" id="sEmail"' + (srv.email !== false ? ' checked' : '') + '><span>Lire aussi les courriels d’alerte des banques dans Gmail (toutes les 15 min)</span></label>' +
      '<label class="field"><span>Me prévenir si rien n’arrive depuis (jours)</span><input id="sHeartbeat" type="number" min="1" max="30" value="' + (srv.heartbeatDays || 3) + '"></label>' +
      '<h3>Règles de classement</h3>' +
      '<div class="rules" id="sRules">' + (state.data.rules.length ? state.data.rules.map(function (r) {
        return '<div class="rule"><span>« ' + esc(r.pattern) + ' » → ' + esc(r.category === '(ignorer)' ? 'ignoré' : catLabel(r.category)) + (r.name ? ' (affiché « ' + esc(r.name) + ' »)' : '') + '</span><button data-rule="' + esc(r.pattern) + '" aria-label="Supprimer la règle">✕</button></div>';
      }).join('') : '<p class="sub">Aucune règle. Corrigez une catégorie dans une transaction : elle devient une règle.</p>') + '</div>' +
      '</div>' +
      '<h3>À propos</h3>' +
      '<p class="sub"><a href="' + GUIDE_URL + '" target="_blank" rel="noopener">Guide d’installation</a>' + (state.data.sheetUrl ? ' · <a href="' + esc(state.data.sheetUrl) + '" target="_blank" rel="noopener">Ouvrir la feuille</a>' : '') +
      (state.data.version ? ' · script ' + esc(state.data.version) : '') + ' · page ' + VERSION + '</p>' +
      '<div class="btns" style="margin-top:14px">' + (s.demo ? '<button class="btn" data-sheet="leave-demo">Quitter les exemples</button>' : '') + '<span class="spacer"></span><button class="btn" data-sheet="cancel">Annuler</button><button class="btn primary" data-sheet="save">Enregistrer</button></div>',
      function (root) {
        if (connected() && !standalone && !isIOS && typeof SpendQR !== 'undefined') {
          try { $('#sQr', root).innerHTML = SpendQR.svg(setupLink(), { ecl: 'M' }); } catch (e) { $('#sQr', root).textContent = 'Code QR indisponible'; }
        }
        root.oninput = function (ev) {
          if (ev.target.id !== 'sUrl') return;
          var d = decodeSetup(ev.target.value);
          if (d) { $('#sUrl', root).value = d.s.u; $('#sToken', root).value = d.s.k; toast('Lien de configuration reconnu'); }
        };
        root.onclick = function (ev) {
          var rb = ev.target.closest('[data-rule]');
          if (rb) {
            var pattern = rb.dataset.rule;
            mutate(function () { state.data.rules = state.data.rules.filter(function (r) { return r.pattern !== pattern; }); }, 'rule-delete', { pattern: pattern }, function (r) { state.data.rules = r.rules; });
            rb.parentNode.remove();
            return;
          }
          var act = ev.target.closest('[data-sheet]');
          if (!act) return;
          ev.preventDefault();
          var a = act.dataset.sheet;
          var url = $('#sUrl', root).value.trim();
          var token = $('#sToken', root).value.trim();
          if (a === 'cancel') closeSheet();
          if (a === 'copy-shortcut') copyText($('#sShortcut', root).value, $('#sShortcut', root), 'Lien du raccourci copié');
          if (a === 'copy-setup') copyText(setupLink(), null, 'Lien de configuration copié (il contient votre jeton : ne le partagez pas)');
          if (a === 'leave-demo') { state.settings.demo = false; saveSettings(); closeSheet(); loadLocal(); render(); sync(); }
          if (a === 'test') {
            var out = $('#sTest', root);
            if (!validUrl(url) || !token) { out.textContent = 'Indiquez l’adresse (https://…) et le jeton.'; return; }
            out.textContent = 'Test…';
            api('ping', {}, { url: url, token: token }).then(function (r) { out.textContent = '✓ Connecté (script ' + r.version + ', ' + r.currency + ')'; })
              .catch(function (err) { out.textContent = '✗ ' + err.message; });
          }
          if (a === 'save') {
            if (url && !validUrl(url)) { toast('L’adresse doit commencer par https://'); return; }
            var prev = state.settings;
            var next = { url: url, token: token, demo: prev.demo && !(url && token) ? true : false, hideChecklist: prev.hideChecklist };
            var sourceChanged = prev.demo !== next.demo || prev.url !== next.url || prev.token !== next.token;
            var newBudget = Math.max(0, parseFloat($('#sBudget', root).value) || 0);
            var newSettings = { budget: newBudget, digest: $('#sDigest', root).checked, email: $('#sEmail', root).checked, heartbeatDays: Math.max(1, parseInt($('#sHeartbeat', root).value, 10) || 3), currency: $('#sCurrency', root).value };
            state.settings = next;
            saveSettings();
            closeSheet();
            if (sourceChanged) { state.error = ''; loadLocal(); }
            var changed = JSON.stringify(newSettings) !== JSON.stringify({ budget: budget(), digest: srv.digest !== false, email: srv.email !== false, heartbeatDays: Number(srv.heartbeatDays) || 3, currency: mainCurrency() });
            if (changed) { state.data.settings = Object.assign({}, state.data.settings, newSettings); state.data.currency = newSettings.currency; }
            render();
            if (live()) {
              (sourceChanged ? sync() : Promise.resolve()).then(function () {
                if (changed) return api('settings', newSettings).then(function (r) { state.data.settings = r.settings; state.data.currency = r.settings.currency || state.data.currency; persist(); render(); });
              }).catch(function (err) { toast(err.message); });
            } else if (changed) persist();
            toast('Réglages enregistrés');
          }
        };
      });
  }

  /* ------------------------------------------------------------ événements */

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act],[data-view],[data-cat],[data-id]');
    if (!el || dialog.contains(el)) return;
    if (el.dataset.view) { state.view = el.dataset.view; render(); return; }
    if (el.dataset.cat !== undefined && el.classList.contains('cat')) {
      state.cat = state.cat === el.dataset.cat ? '' : el.dataset.cat;
      if (state.view === 'ignored') state.view = 'all';
      render();
      if (state.cat) $('#list').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var act = el.dataset.act;
    if (!act && el.dataset.id) { var t = findTx(el.dataset.id); if (t) openEdit(t); return; }
    if (act === 'edit') { var te = findTx(el.dataset.id); if (te) openEdit(te); }
    if (act === 'confirm') quickStatus(el.dataset.id, 'ok', 'Confirmée');
    if (act === 'dup') quickStatus(el.dataset.id, 'duplicate', 'Marquée comme doublon (non comptée)');
    if (act === 'settings') openSettings();
    if (act === 'demo') { state.settings.demo = true; saveSettings(); loadLocal(); render(); }
    if (act === 'leave-demo') { state.settings.demo = false; saveSettings(); loadLocal(); render(); sync(); }
    if (act === 'sync') sync();
    if (act === 'clear-cat') { state.cat = ''; render(); }
    if (act === 'copy-shortcut') copyText(shortcutUrl(), null, 'Lien du raccourci copié');
    if (act === 'copy-setup') copyText(setupLink(), null, 'Lien de configuration copié (il contient votre jeton : ne le partagez pas)');
    if (act === 'copy-ignored') {
      var lines = state.data.ignored.slice(0, 20).map(function (x) { return reasonLabel(x.reason) + ' | ' + sourceLabel(x.source) + ' | ' + P.redactCodes(x.raw); });
      copyText(lines.join('\n'), null, plural(lines.length, 'notification') + (lines.length > 1 ? ' copiées' : ' copiée'));
    }
    if (act === 'promote') {
      var x = state.data.ignored[+el.dataset.i];
      if (!x) return;
      var when = x._d || new Date();
      openAdd(x.raw, when);
      // Une fois ajoutée, la ligne ignorée disparaît.
      var ignored = x;
      var done = function () { if (live()) api('unignore', { captured_at: ignored.captured_at, raw: ignored.raw }).catch(function () { /* déjà partie */ }); };
      dialog.addEventListener('close', function once() {
        dialog.removeEventListener('close', once);
        if (state.data.ignored.indexOf(ignored) >= 0 && state.data.transactions.some(function (t) { return t.raw === ignored.raw || t.source === 'paste' && Math.abs(t._d - when) < 1000; })) {
          state.data.ignored = state.data.ignored.filter(function (y) { return y !== ignored; });
          done();
          render();
        }
      });
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'q') { state.q = ev.target.value; renderListBody(monthTx(state.month), mainCurrency()); }
  });
  $('#prevMonth').addEventListener('click', function () { state.month = addMonths(state.month, -1); render(); });
  $('#nextMonth').addEventListener('click', function () { state.month = addMonths(state.month, 1); render(); });
  $('#syncBtn').addEventListener('click', function () { sync(); });
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#addBtn').addEventListener('click', function () { openAdd(''); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && live() && Date.now() - state.lastSync > 60000) sync(true);
  });
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if ($('#daily')) renderDaily(monthTx(state.month), mainCurrency()); }, 150);
  });

  var toastTimer;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  /* ------------------------------------------------------------ exemples */

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function fr$(a) { return a.toFixed(2).replace('.', ',') + ' $'; }
  // Des notifications d'exemple dans les formats de Scotia, Capital One, Wealthsimple et Cartes, lues par le même parseur que la feuille.
  function makeDemo() {
    var R = rng(20261101);
    var now = new Date();
    var start = addMonths(startOfMonth(now), -2);
    var tx = [];
    var ignored = [];
    var opts = { defaultCurrency: 'CAD' };
    var shops = [
      ['IGA EXTRA', 18, 95, 5], ['METRO PLUS', 12, 80, 4], ['CAFE OLIMPICO', 4, 9, 7], ['TIM HORTONS', 3, 8, 4],
      ['UBER *TRIP', 9, 28, 3], ['PETRO-CANADA', 35, 70, 2], ['AMAZON.CA', 15, 120, 2], ['JEAN COUTU', 8, 40, 1],
      ['CINEMA GUZZO', 14, 32, 1], ['LA BANQUISE', 22, 60, 2], ['RENAUD-BRAY', 25, 80, 0.4], ['STM', 3.75, 3.75, 3], ['SAQ', 15, 60, 1]
    ];
    var weight = shops.reduce(function (s, x) { return s + x[3]; }, 0);
    function pick() { var r = R() * weight; for (var i = 0; i < shops.length; i++) { r -= shops[i][3]; if (r <= 0) return shops[i]; } return shops[0]; }
    var formats = [
      function (m, a) { return { title: 'InfoAlerte Scotia', body: 'Un achat de ' + fr$(a) + ' a été effectué chez ' + m + ' avec votre carte Visa se terminant par 4821.' }; },
      function (m, a) { return { title: 'Visa Scotia', subtitle: m, body: fr$(a) }; },
      function (m, a) { return { title: 'Capital One', body: 'A purchase of $' + a.toFixed(2) + ' at ' + m + ' was approved on your card ending in 0937.' }; },
      function (m, a) { return { title: 'Wealthsimple', body: 'Vous avez dépensé ' + fr$(a) + ' chez ' + m }; }
    ];
    function push(n, d, flags) {
      var r = P.parse(n, opts);
      var raw = [n.title, n.subtitle, n.body].filter(Boolean).join(' | ');
      var bank = P.inferBank(n);
      if (r.kind !== 'transaction') { ignored.push({ captured_at: d.toISOString(), source: 'phone' + (bank ? ':' + bank : ''), reason: r.reason, raw: P.redactCodes(raw) }); return null; }
      var t = { id: 'demo' + tx.length, date: d.toISOString(), amount: P.signedAmount(r.amount, r.type), currency: r.currency, merchant: r.merchant,
        category: r.category, type: r.type, card: r.card, status: r.status, note: r.reason === 'hold' ? 'Préautorisation' : '', source: 'phone' + (bank ? ':' + bank : ''), raw: raw, reader: 'rules', flags: flags || '' };
      tx.push(t);
      return t;
    }
    function at(day, h, mnt) { return new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, mnt); }
    for (var day = new Date(start); day <= now; day = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1)) {
      var n = Math.floor(R() * 3.2);
      for (var i = 0; i < n; i++) {
        var s = pick();
        var amount = Math.round((s[1] + R() * (s[2] - s[1])) * 100) / 100;
        var d = at(day, 8 + Math.floor(R() * 13), Math.floor(R() * 60));
        if (d > now) continue;
        push(formats[Math.floor(R() * formats.length)](s[0], amount), d);
      }
      var dom = day.getDate();
      if (dom === 3) push({ title: 'Capital One', body: 'A purchase of $' + (day.getMonth() === now.getMonth() ? '18.99' : '16.99') + ' at NETFLIX.COM was approved on your card ending in 0937.' }, at(day, 6, 2));
      if (dom === 12) push({ title: 'InfoAlerte Scotia', body: 'Un achat de 11,99 $ a été effectué chez SPOTIFY avec votre carte Visa se terminant par 4821.' }, at(day, 7, 15));
      if (dom === 15) push({ title: 'InfoAlerte Scotia', body: 'Un paiement préautorisé de 85,00 $ à HYDRO-QUÉBEC a été effectué depuis votre compte.' }, at(day, 5, 40));
      if (dom === 20) push({ title: 'InfoAlerte Scotia', body: 'Un paiement de facture de 65,00 $ à FIZZ a été effectué depuis votre compte se terminant par 1234.' }, at(day, 9, 5));
    }
    var y = new Date(now.getFullYear(), now.getMonth(), Math.max(1, now.getDate() - 1));
    push({ title: 'Capital One', body: 'Un crédit de 24,99 $ de AMAZON.CA a été porté à votre compte.' }, at(y, 10, 12));
    push({ title: 'InfoAlerte Scotia', body: 'Un paiement de 500,00 $ a été porté à votre carte de crédit se terminant par 4821.' }, at(y, 8, 0));
    push({ title: 'Capital One', body: 'A purchase of $12.40 was approved on your card ending 0937' }, at(y, 13, 30));
    var big = push({ title: 'Capital One', body: 'A purchase of $649.00 at APPLE STORE STE-CATHERINE was approved on your card ending in 0937.' }, at(y, 15, 10), 'large,new');
    void big;
    var dupDay = new Date(now.getFullYear(), now.getMonth(), Math.max(1, now.getDate() - 2));
    push({ title: 'Visa Scotia', subtitle: 'Café Olimpico', body: '4,75 $' }, at(dupDay, 12, 4));
    var dup = push({ title: 'InfoAlerte Scotia', body: 'Un achat de 4,75 $ a été effectué chez CAFE OLIMPICO avec votre carte Visa se terminant par 4821.' }, at(dupDay, 12, 5));
    if (dup) { dup.status = 'duplicate'; dup.note = 'Doublon probable de Café Olimpico (Cartes · iPhone)'; }
    push({ title: 'Capital One', body: 'Your verification code is 482913. Do not share it.' }, at(y, 18, 2));
    push({ title: 'Wealthsimple', body: 'Gagnez 50 $ en parrainant un ami – offre à durée limitée !' }, at(y, 11, 0));
    push({ title: 'InfoAlerte Scotia', body: 'Le solde de votre compte se terminant par 1234 est inférieur à 100,00 $.' }, at(y, 7, 30));
    push({ title: 'Capital One', body: 'Your transaction of $64.00 at ELECTRO STORE was declined' }, at(dupDay, 16, 45));
    ignored.sort(function (a, b) { return b.captured_at < a.captured_at ? -1 : 1; });
    return {
      transactions: tx, ignored: ignored, rules: [{ pattern: 'cafe olimpico', category: 'Dining', name: 'Café Olimpico' }], currency: 'CAD', sheetUrl: '',
      captureToken: 'exemple', shortcutUrl: '', version: VERSION,
      settings: { budget: 1800, digest: true, email: true, heartbeatDays: 3, triggers: true },
      health: { lastPhoneAt: new Date(now.getTime() - 3 * 3600000).toISOString(), lastEmailAt: new Date(now.getTime() - 20 * 3600000).toISOString(), shortcutPingAt: start.toISOString(), bySource: {}, staleHits: 0, emailOnly7d: 0, claude: { on: false } }
    };
  }

  /* ------------------------------------------------------------ icône de l'écran d'accueil */

  (function icon() {
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 180;
      var g = c.getContext('2d');
      var grad = g.createLinearGradient(0, 0, 180, 180);
      grad.addColorStop(0, '#3987e5'); grad.addColorStop(1, '#1c5cab');
      g.fillStyle = grad; g.fillRect(0, 0, 180, 180);
      g.fillStyle = 'rgba(255,255,255,.95)';
      [[42, 96, 34], [73, 70, 60], [104, 108, 22], [135, 52, 78]].forEach(function (b) {
        var x = b[0], h = b[2], top = 140 - h, w = 22, r = 6;
        g.beginPath(); g.moveTo(x, 140); g.lineTo(x, top + r); g.quadraticCurveTo(x, top, x + r, top); g.lineTo(x + w - r, top);
        g.quadraticCurveTo(x + w, top, x + w, top + r); g.lineTo(x + w, 140); g.closePath(); g.fill();
      });
      var link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    } catch (e) { /* pas de canvas */ }
  })();

  /* ------------------------------------------------------------ démarrage */

  applySetupHash();
  loadLocal();
  render();
  if (live()) sync(true);
  window.__depenses = { state: state, render: render, sync: sync, parseStatement: parseStatement };
})();
