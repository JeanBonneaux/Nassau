<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Drift</title>
<meta name="description" content="Release paper lanterns from a dark lake. Each one hums a note as it rises, glowing in time.">
<style>
html,body{margin:0;height:100%;background:#070a1a;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#ffe8b8}
canvas{position:fixed;inset:0;width:100%;height:100dvh;touch-action:none;display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,10,26,.72);text-align:center;padding:24px;cursor:pointer;transition:opacity .8s}
#start h1{font-weight:300;letter-spacing:.2em;font-size:30px;margin:0;text-transform:uppercase}
#start p{margin:0;font-size:17px;opacity:.8;max-width:290px;line-height:1.45}
#start b{display:inline-block;margin-top:10px;padding:14px 30px;border:1px solid #ffcf7a;border-radius:40px;font-weight:400;font-size:18px;min-height:20px}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:16px;opacity:0;transition:opacity 1s;pointer-events:none}
a.back{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;color:#ffe8b8;opacity:.6;font-size:16px;text-decoration:none;padding:12px 8px;z-index:3}
#mute{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;width:48px;height:48px;border:0;background:none;color:#ffe8b8;opacity:.6;font-size:22px;z-index:3}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="../index.html">← Gallery</a>
<button id="mute" aria-label="Toggle sound">♪</button>
<div id="hint">Tap the lake to release a lantern</div>
<div id="start"><h1>Lantern Drift</h1><p>Release lanterns from the water. Left is low, right is high. Each one hums its own note as it rises.</p><b>Tap to begin</b></div>
<script>
(function(){
var cv=document.getElementById('c'),g=cv.getContext('2d');
var W,H,dpr,horizon;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;horizon=H*0.8;mkStars();}
var stars=[];
function mkStars(){stars=[];for(var i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*horizon*0.92,r:Math.random()*1.2+.3,p:Math.random()*6.28,s:.5+Math.random()*1.5});}
addEventListener('resize',resize);resize();
// audio
var ac=null,master,wet,muted=false;
var scale=[0,2,4,7,9]; // major pentatonic
function noteFreq(i){var oct=Math.floor(i/5),d=scale[((i%5)+5)%5];return 130.81*Math.pow(2,(oct*12+d)/12);}
function initAudio(){
 if(ac){if(ac.state!=='running')ac.resume();return;}
 var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
 ac=new A();master=ac.createGain();master.gain.value=muted?0:.8;master.connect(ac.destination);
 wet=ac.createGain();wet.gain.value=.5;
 var d1=ac.createDelay(2),d2=ac.createDelay(2),fb=ac.createGain(),lp=ac.createBiquadFilter();
 d1.delayTime.value=.37;d2.delayTime.value=.53;fb.gain.value=.5;lp.type='lowpass';lp.frequency.value=1800;
 wet.connect(d1);wet.connect(d2);d1.connect(lp);d2.connect(lp);lp.connect(fb);fb.connect(d1);fb.connect(d2);lp.connect(master);
}
function play(i,vol){
 if(!ac||ac.state!=='running')return;
 var t=ac.currentTime,f=noteFreq(i);
 var o=ac.createOscillator(),o2=ac.createOscillator(),gn=ac.createGain();
 o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2.003;
 var g2=ac.createGain();g2.gain.value=.18;
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol*.22,t+.35);gn.gain.exponentialRampToValueAtTime(.0005,t+3.2);
 o.connect(gn);o2.connect(g2);g2.connect(gn);gn.connect(master);gn.connect(wet);
 o.start(t);o2.start(t);o.stop(t+3.3);o2.stop(t+3.3);
}
// lanterns
var L=[],ripples=[],sparks=[],T=0;
var cols=[[255,170,70],[255,130,90],[255,200,100],[255,110,120]];
function release(x){
 var n=Math.max(0,Math.min(14,Math.floor(x/W*15)));
 var size=26+Math.random()*14;
 var l={x:x,y:horizon+8,vx:0,n:n,size:size,col:cols[Math.floor(Math.random()*cols.length)],
  ph:Math.random()*6.28,per:2.2+Math.random()*1.6,next:0.2,flare:0,age:0,rise:22+Math.random()*12,sw:8+Math.random()*10};
 l.next=T+.15;L.push(l);
 ripples.push({x:x,r:4,a:.7});
 if(L.length>40)L.shift();
 hideHint();
}
var hintEl=document.getElementById('hint'),hinted=false;
function hideHint(){hintEl.style.opacity=0;hinted=true;}
cv.addEventListener('pointerdown',function(e){
 e.preventDefault();initAudio();
 if(startEl.style.display==='none')release(e.clientX);
});
var startEl=document.getElementById('start');
startEl.addEventListener('pointerdown',function(e){e.preventDefault();initAudio();startEl.style.opacity=0;setTimeout(function(){startEl.style.display='none';},800);
 T0=performance.now();setTimeout(function(){if(!hinted)hintEl.style.opacity=.75;},1200);
 [2,6,9].forEach(function(n,k){setTimeout(function(){release(W*(n+.5)/15);},300+k*700);});});
document.getElementById('mute').addEventListener('click',function(){muted=!muted;this.style.opacity=muted?.25:.6;if(master)master.gain.value=muted?0:.8;});
var T0=performance.now(),last=performance.now();
function glowSprite(c){return 'rgba('+c[0]+','+c[1]+','+c[2]+',';}
function drawLantern(l,y,flip,alpha){
 var s=l.size,w=s*.8,h=s*1.05,x=l.x;
 var pulse=l.flare;
 g.save();g.globalAlpha=alpha;
 g.translate(x,y);if(flip)g.scale(1,-1);
 var gr=g.createRadialGradient(0,-h*.5,2,0,-h*.5,s*(2.2+pulse*2.2));
 var c=glowSprite(l.col);
 gr.addColorStop(0,c+(.28+pulse*.4)+')');gr.addColorStop(1,c+'0)');
 g.fillStyle=gr;g.beginPath();g.arc(0,-h*.5,s*(2.2+pulse*2.2),0,6.28);g.fill();
 // body
 var bg=g.createLinearGradient(0,-h,0,0);
 bg.addColorStop(0,'rgb(255,'+(225+pulse*30|0)+',160)');bg.addColorStop(1,'rgb('+l.col[0]+','+l.col[1]+','+l.col[2]+')');
 g.fillStyle=bg;
 g.beginPath();g.moveTo(-w*.38,0);g.lineTo(w*.38,0);g.quadraticCurveTo(w*.62,-h*.5,w*.5,-h*.88);g.lineTo(-w*.5,-h*.88);g.quadraticCurveTo(-w*.62,-h*.5,-w*.38,0);g.fill();
 // rib lines
 g.strokeStyle='rgba(120,50,20,.35)';g.lineWidth=1;
 g.beginPath();g.moveTo(0,0);g.lineTo(0,-h*.88);g.moveTo(-w*.22,0);g.quadraticCurveTo(-w*.38,-h*.45,-w*.26,-h*.88);g.moveTo(w*.22,0);g.quadraticCurveTo(w*.38,-h*.45,w*.26,-h*.88);g.stroke();
 // caps
 g.fillStyle='#5a2a18';g.fillRect(-w*.5,-h*.92,w,h*.06);g.fillRect(-w*.38,-h*.02,w*.76,h*.06);
 g.restore();
}
function frame(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
 // sky
 var sg=g.createLinearGradient(0,0,0,horizon);sg.addColorStop(0,'#04061a');sg.addColorStop(1,'#1d1a3e');
 g.setTransform(dpr,0,0,dpr,0,0);
 g.fillStyle=sg;g.fillRect(0,0,W,horizon);
 stars.forEach(function(s){g.globalAlpha=.4+.5*Math.sin(T*s.s+s.p);g.fillStyle='#fff';g.fillRect(s.x,s.y,s.r,s.r);});g.globalAlpha=1;
 // moon
 var mx=W*.78,my=horizon*.2,mg=g.createRadialGradient(mx,my,4,mx,my,70);mg.addColorStop(0,'rgba(255,245,215,.35)');mg.addColorStop(1,'rgba(255,245,215,0)');
 g.fillStyle=mg;g.fillRect(mx-80,my-80,160,160);g.fillStyle='#f6ecd0';g.beginPath();g.arc(mx,my,13,0,6.28);g.fill();
 // water
 var wg=g.createLinearGradient(0,horizon,0,H);wg.addColorStop(0,'#14143a');wg.addColorStop(1,'#04050f');
 g.fillStyle=wg;g.fillRect(0,horizon,W,H-horizon);
 // distant shore
 g.fillStyle='#05071a';g.beginPath();g.moveTo(0,horizon);
 for(var x=0;x<=W;x+=20)g.lineTo(x,horizon-6-4*Math.sin(x*.02)-3*Math.sin(x*.07));
 g.lineTo(W,horizon);g.fill();
 // update lanterns
 for(var i=L.length-1;i>=0;i--){
  var l=L[i];l.age+=dt;
  l.y-=l.rise*dt*(l.age<3?.5+l.age/6:1);
  l.x+=Math.sin(T*.5+l.ph)*l.sw*dt+3*dt;
  if(T>=l.next){play(l.n,Math.max(.3,Math.min(1,l.y/H+.2)));l.flare=1;l.next=T+l.per;}
  l.flare=Math.max(0,l.flare-dt*.8);
  l.alpha=Math.min(1,l.age/1.5)*Math.max(0,Math.min(1,(l.y+40)/(H*.25)));
  if(l.y<-80||l.x>W+80){L.splice(i,1);}
 }
 // reflections
 var sorted=L.slice().sort(function(a,b){return a.y-b.y;});
 sorted.forEach(function(l){
  var ry=horizon+(horizon-l.y)*.35;
  if(ry<H+60){var wob=Math.sin(T*3+l.ph)*2;var ll={x:l.x+wob,size:l.size*.85,col:l.col,flare:l.flare};drawLantern(ll,ry,true,.22*l.alpha);}
 });
 // ripples on water
 for(i=ripples.length-1;i>=0;i--){var r=ripples[i];r.r+=40*dt;r.a-=dt*.25;if(r.a<=0){ripples.splice(i,1);continue;}
  g.strokeStyle='rgba(255,210,150,'+r.a+')';g.lineWidth=1.2;g.beginPath();g.ellipse(r.x,horizon+12,r.r*2,r.r*.35,0,0,6.28);g.stroke();}
 // water shimmer lines
 g.strokeStyle='rgba(180,170,255,.05)';g.lineWidth=1;
 for(var k=0;k<14;k++){var yy=horizon+14+k*k*1.6+6;if(yy>H)break;g.beginPath();for(x=0;x<=W;x+=24)g.lineTo(x,yy+Math.sin(x*.03+T*.8+k)*1.5);g.stroke();}
 // lanterns
 g.globalCompositeOperation='lighter';
 sorted.forEach(function(l){var c=glowSprite(l.col);});
 g.globalCompositeOperation='source-over';
 sorted.forEach(function(l){drawLantern(l,l.y,false,l.alpha);});
 // sparks on note
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
