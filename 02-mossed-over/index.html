<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mossed Over</title>
<meta name="description" content="Old stones carry tiny poems, but moss has grown over them. Brush the moss away with your finger to read, and watch it slowly creep back.">
<style>
:root{--ink:#dfe8cf;--dim:#9db28a;--bg1:#16210f;--bg2:#0b110a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg2);overflow:hidden;overscroll-behavior:none}
body{font-family:ui-serif,Georgia,serif;color:var(--ink);
 background:radial-gradient(120% 90% at 50% 40%,#1f2e15 0%,var(--bg1) 45%,var(--bg2) 100%);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;height:100dvh}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top a{pointer-events:auto;color:var(--dim);font:16px/44px system-ui,-apple-system,sans-serif;text-decoration:none;min-width:44px;opacity:.8}
.top .t{font-style:italic;letter-spacing:.08em;color:var(--dim);font-size:16px;opacity:.85}
.bar{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:4px}
#hint{font-size:16px;font-style:italic;color:var(--dim);height:22px;transition:opacity 1.2s;text-align:center}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:48px;height:48px;border-radius:24px;border:0;background:rgba(160,190,120,.12);color:var(--ink);font-size:22px;font-family:system-ui,sans-serif;touch-action:manipulation}
.nav button:active{background:rgba(160,190,120,.3)}
.dots{display:flex;gap:2px}
.dots button{width:44px;height:48px;background:none;border-radius:0;display:grid;place-items:center;padding:0}
.dots i{display:block;width:10px;height:10px;border-radius:50%;background:#52663f;transition:all .3s}
.dots button.on i{background:#c5dc9a;transform:scale(1.35)}
.dots button.done i{box-shadow:0 0 0 2px rgba(197,220,154,.35)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="top"><a href="../index.html">← Gallery</a><span class="t">Mossed Over</span><span style="min-width:44px"></span></div>
  <div class="bar">
    <div id="hint">Brush the moss away with your finger.</div>
    <div class="nav">
      <button id="prev" aria-label="Previous stone">‹</button>
      <div class="dots" id="dots"></div>
      <button id="next" aria-label="Next stone">›</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var POEMS=[
 ["Nothing here is hurrying.","The rain arrives on time.","What the stone calls waiting,","the moss calls climbing."],
 ["I left your name","on the cold side of the wall.","Something green","has been keeping it since."],
 ["Slow is not stopped.","Ask the hill how long","it has been becoming","a hill."],
 ["Come back in a year.","The letters will be softer,","the green will be kinder,","and you will be someone else."],
 ["Press your palm here.","Feel how small a century is,","folded into velvet,","folded into dark."]
];
var HUES=[[118,112,104],[110,114,116],[124,114,100],[104,108,106],[120,116,108]];
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2),W=0,H=0;
var CELL=3;
var stones=POEMS.map(function(p,i){return{poem:p,seed:i*97+13,moss:null,read:false,tint:HUES[i]}});
var cur=0,S=null; // S = current rendered stone state
var particles=[],brush={x:0,y:0,down:false,has:false},dirty=true,touched=false;
try{if(localStorage.getItem('mossedOverTouched'))touched=true}catch(e){}

function rng(seed){var s=seed>>>0||1;return function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function hash(x,y,s){var h=(x*374761393+y*668265263+s*982451653)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296}
function sm(t){return t*t*(3-2*t)}
function vnoise(x,y,s){var xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi);
 var a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);
 return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf}
function fbm(x,y,s,o){var v=0,a=.5,f=1,t=0;for(var i=0;i<o;i++){v+=a*vnoise(x*f,y*f,s+i*31);t+=a;a*=.5;f*=2}return v/t}

function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}

// stone outline path in css px relative to stone rect
function stonePath(g,sw,sh,seed,pad){
 var n=72,pts=[],r=rng(seed),k=2+r()*1.2,ph=r()*6;
 var ex=3.6+r()*1.2;
 for(var i=0;i<n;i++){var t=i/n*Math.PI*2,c=Math.cos(t),s=Math.sin(t);
  var rr=1/Math.pow(Math.pow(Math.abs(c),ex)+Math.pow(Math.abs(s),ex),1/ex);
  var wob=1+.035*Math.sin(t*k+ph)+.025*Math.sin(t*5+ph*2)+.02*(fbm(Math.cos(t)*2+5,Math.sin(t)*2+5,seed,3)-.5)*2;
  pts.push([sw/2+c*rr*(sw/2-pad)*wob,sh/2+s*rr*(sh/2-pad)*wob])}
 g.beginPath();
 for(var j=0;j<n;j++){var p0=pts[j],p1=pts[(j+1)%n],mx=(p0[0]+p1[0])/2,my=(p0[1]+p1[1])/2;
  if(j===0)g.moveTo(mx,my);
  var pn=pts[(j+1)%n],pn2=pts[(j+2)%n];
  var nx=(pn[0]+pn2[0])/2,ny=(pn[1]+pn2[1])/2;
  g.quadraticCurveTo(pn[0],pn[1],nx,ny)}
 g.closePath()}

function build(){
 W=window.innerWidth;H=window.innerHeight;
 dpr=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 var topM=64,botM=112+ (window.innerHeight>700?0:0);
 var sw=Math.min(W-20,600),sh=Math.min(H-topM-botM,820);
 sh=Math.min(sh,sw*1.45);if(sh<200)sh=200;
 var sx=(W-sw)/2,sy=topM+(H-topM-botM-sh)/2;
 S={sx:sx,sy:sy,sw:sw,sh:sh};
 buildStone();
}

function buildStone(){
 var st=stones[cur],sw=S.sw,sh=S.sh,P=24; // pad for shadow
 var pw=sw+P*2,ph=sh+P*2,sc=dpr;
 // stone texture
 var tc=mk(pw*sc,ph*sc),g=tc.getContext('2d');
 g.scale(sc,sc);
 // shadow
 g.save();g.translate(P,P);
 g.shadowColor='rgba(0,0,0,.65)';g.shadowBlur=22;g.shadowOffsetY=10;g.fillStyle='#000';
 stonePath(g,sw,sh,st.seed,2);g.fill();g.restore();
 // texture via ImageData at half res
 var tw=Math.ceil(sw/2),th=Math.ceil(sh/2),tex=mk(tw,th),tg=tex.getContext('2d'),id=tg.createImageData(tw,th),d=id.data;
 var base=st.tint,sd=st.seed;
 for(var y=0;y<th;y++)for(var x=0;x<tw;x++){
  var n1=fbm(x/38,y/38,sd,4),n2=fbm(x/9+50,y/9,sd+7,3),n3=fbm(x/3,y/3,sd+3,2);
  var v=.62+(n1-.5)*.7+(n2-.5)*.28+(n3-.5)*.18;
  // light from upper-left
  var lx=x/tw,ly=y/th;v+= (0.5-lx*.5-ly*.5)*.28;
  var cr=fbm(x/14+9,y/14+9,sd+17,2);if(cr>.66&&cr<.69)v-=.16; // faint veins
  var i4=(y*tw+x)*4;
  d[i4]=Math.max(0,Math.min(255,base[0]*v*1.05));d[i4+1]=Math.max(0,Math.min(255,base[1]*v));d[i4+2]=Math.max(0,Math.min(255,base[2]*v*.95));d[i4+3]=255}
 tg.putImageData(id,0,0);
 g.save();g.translate(P,P);stonePath(g,sw,sh,st.seed,2);g.clip();
 g.imageSmoothingEnabled=true;g.drawImage(tex,0,0,sw,sh);
 // edge darkening
 var rg=g.createRadialGradient(sw*.4,sh*.38,Math.min(sw,sh)*.2,sw/2,sh/2,Math.max(sw,sh)*.62);
 rg.addColorStop(0,'rgba(255,255,240,.10)');rg.addColorStop(.7,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,.5)');
 g.fillStyle=rg;g.fillRect(0,0,sw,sh);
 // rim light
 g.restore();
 g.save();g.translate(P,P);stonePath(g,sw,sh,st.seed,2);g.lineWidth=2;g.strokeStyle='rgba(255,255,235,.14)';g.stroke();g.restore();
 // engraved text
 g.save();g.translate(P,P);
 var lines=st.poem,fs=Math.min(26,sw*.075),maxw=sw*.74;
 g.font='italic '+fs+'px ui-serif,Georgia,serif';
 var mw=0;lines.forEach(function(l){mw=Math.max(mw,g.measureText(l).width)});
 if(mw>maxw)fs=Math.max(16,fs*maxw/mw);
 g.font='italic '+fs+'px ui-serif,Georgia,serif';
 g.textAlign='center';g.textBaseline='middle';
 var lh=fs*1.75,y0=sh/2-(lines.length-1)*lh/2;
 st.lines=lines.map(function(l,i){var w=g.measureText(l).width;return{x0:sw/2-w/2-6,x1:sw/2+w/2+6,y0:y0+i*lh-lh*.42,y1:y0+i*lh+lh*.42}});
 lines.forEach(function(l,i){var y=y0+i*lh;
  g.fillStyle='rgba(255,255,240,.28)';g.fillText(l,sw/2,y+1.3);
  g.fillStyle='rgba(18,16,12,.82)';g.fillText(l,sw/2,y-.3);
  g.fillStyle='rgba(30,26,20,.5)';g.fillText(l,sw/2+.4,y)});
 g.restore();
 S.stone=tc;S.P=P;

 // mask for moss: cells inside stone path
 var gw=Math.ceil(sw/CELL),gh=Math.ceil(sh/CELL);
 var mc=mk(gw,gh),mg=mc.getContext('2d');mg.scale(1/CELL,1/CELL);mg.fillStyle='#fff';
 stonePath(mg,sw,sh,st.seed,0);mg.fill();
 var md=mg.getImageData(0,0,gw,gh).data,mask=new Uint8Array(gw*gh);
 for(var i=0;i<gw*gh;i++)mask[i]=md[i*4+3]>100?1:0;
 S.gw=gw;S.gh=gh;S.mask=mask;
 if(!st.moss||st.moss.length!==gw*gh){
  var m=new Float32Array(gw*gh);
  for(var y2=0;y2<gh;y2++)for(var x2=0;x2<gw;x2++){
   var q=y2*gw+x2;if(!mask[q])continue;
   var nn=fbm(x2/9,y2/9,st.seed+5,3);
   m[q]=Math.min(1,.2+nn*1.05+ (fbm(x2/3,y2/3,st.seed,2)-.5)*.4);
  }
  // a few thin bald patches
  var r=rng(st.seed+1);
  for(var b=0;b<4;b++){var bx=r()*gw,by=r()*gh,br=3+r()*5;
   for(var yy=0;yy<gh;yy++)for(var xx=0;xx<gw;xx++){var dd=Math.hypot(xx-bx,yy-by);if(dd<br)m[yy*gw+xx]*=Math.max(.35,dd/br)}}
  st.moss=m;
 }
 S.m2=new Float32Array(gw*gh);
 // render canvases
 S.small=mk(gw,gh);S.sg=S.small.getContext('2d');S.simg=S.sg.createImageData(gw,gh);
 S.mc=mk(sw*sc,sh*sc);S.mg=S.mc.getContext('2d');
 // speckle tile
 var tile=mk(160,160),tg2=tile.getContext('2d'),r2=rng(77);
 for(var k=0;k<2600;k++){var a=r2();tg2.fillStyle=a<.35?'rgba(10,35,8,.55)':a<.8?'rgba(90,135,45,.4)':'rgba(160,195,95,.4)';
  var px=r2()*160,py=r2()*160,s=.6+r2()*1.2;tg2.fillRect(px,py,s,s*(.8+r2()))}
 S.tile=tile;
 var hole=mk(160,160),hg=hole.getContext('2d'),r3=rng(5);
 for(k=0;k<420;k++){hg.fillStyle='rgba(0,0,0,'+(.5+r3()*.5)+')';var hx=r3()*160,hy=r3()*160;hg.beginPath();hg.arc(hx,hy,.5+r3()*1.4,0,7);hg.fill()}
 S.hole=hole;
 S.edge=mk(sw*sc,sh*sc);var eg=S.edge.getContext('2d');eg.scale(sc,sc);eg.fillStyle='#000';eg.strokeStyle='#000';eg.lineWidth=5;stonePath(eg,sw,sh,st.seed,2);eg.fill();eg.stroke();
 dirty=true;
}

var gAcc=0;
function grow(){
 var m=stones[cur].moss,m2=S.m2,gw=S.gw,gh=S.gh,mask=S.mask,sd=stones[cur].seed;
 var changed=false;
 for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){
  var i=y*gw+x;
  if(!mask[i]){continue}
  var d=m[i];
  if(d>=.999){m2[i]=d;continue}
  var mx=0;
  if(x>0&&m[i-1]>mx)mx=m[i-1];
  if(x<gw-1&&m[i+1]>mx)mx=m[i+1];
  if(y>0&&m[i-gw]>mx)mx=m[i-gw];
  if(y<gh-1&&m[i+gw]>mx)mx=m[i+gw];
  var nz=.4+hash(x,y,sd)*.9;
  var nd=d+.0075*nz*mx*(1-d)+.0003*(1-d);
  if(nd>1)nd=1;m2[i]=nd;if(nd!==d)changed=true;
 }
 var t=stones[cur].moss;stones[cur].moss=m2;S.m2=t;
 return changed;
}

function renderMoss(){
 var m=stones[cur].moss,gw=S.gw,gh=S.gh,d=S.simg.data,sd=stones[cur].seed;
 for(var y=0;y<gh;y++)for(var x=0;x<gw;x++){
  var i=y*gw+x,q=i*4,v=m[i];
  if(!S.mask[i]||v<=.02){d[q+3]=0;continue}
  var nz=fbm(x/4,y/4,sd+9,2);
  var a=v<.12?v/.12*.3:v<.55?.3+(v-.12)/.43*.65:1;
  var shade=.55+.45*Math.min(1,v)+ (nz-.5)*.5;
  // rich greens, a little yellow in thin growth, deep at density
  var thin=1-Math.min(1,v);
  d[q]=Math.max(0,Math.min(255,(28+thin*50)*shade+22*nz));
  d[q+1]=Math.max(0,Math.min(255,(84+thin*30)*shade+22*nz));
  d[q+2]=Math.max(0,Math.min(255,(24+thin*10)*shade));
  d[q+3]=a*255;
 }
 S.sg.putImageData(S.simg,0,0);
 var g=S.mg,sw=S.sw*dpr,sh=S.sh*dpr;
 g.globalCompositeOperation='source-over';g.clearRect(0,0,sw,sh);
 g.imageSmoothingEnabled=true;g.drawImage(S.small,0,0,sw,sh);
 // fuzz: speckle highlights/shadows on moss only
 g.globalCompositeOperation='source-atop';
 var p=g.createPattern(S.tile,'repeat');g.save();g.scale(dpr/1.3,dpr/1.3);g.fillStyle=p;g.fillRect(0,0,sw*1.3/dpr,sh*1.3/dpr);g.restore();
 g.globalCompositeOperation='destination-out';
 var p2=g.createPattern(S.hole,'repeat');g.save();g.scale(dpr/1.3,dpr/1.3);g.fillStyle=p2;g.fillRect(0,0,sw*1.3/dpr,sh*1.3/dpr);g.restore();
 g.globalCompositeOperation='destination-in';g.drawImage(S.edge,0,0);
 g.globalCompositeOperation='source-over';
}

function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,W,H);
 if(!S)return;
 ctx.drawImage(S.stone,S.sx-S.P,S.sy-S.P,S.sw+S.P*2,S.sh+S.P*2);
 ctx.drawImage(S.mc,S.sx,S.sy,S.sw,S.sh);
 // moss soft shadow cast on stone is skipped; particles:
 for(var i=0;i<particles.length;i++){var p=particles[i];
  ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}
 ctx.globalAlpha=1;
 if(brush.has){ctx.strokeStyle='rgba(230,245,200,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(brush.x,brush.y,R,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(brush.x,brush.y,R+1.5,0,7);ctx.stroke()}
}

var R=26;
function scrape(px,py){
 var m=stones[cur].moss,gw=S.gw,gh=S.gh;
 var cx=(px-S.sx)/CELL,cy=(py-S.sy)/CELL,rr=R/CELL;
 var x0=Math.max(0,Math.floor(cx-rr-1)),x1=Math.min(gw-1,Math.ceil(cx+rr+1)),y0=Math.max(0,Math.floor(cy-rr-1)),y1=Math.min(gh-1,Math.ceil(cy+rr+1));
 var removed=0;
 for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){
  var dd=Math.hypot(x-cx,y-cy);if(dd>rr)continue;
  var i=y*gw+x;if(m[i]<=0)continue;
  var f=dd<rr*.65?0:(dd-rr*.65)/(rr*.35);
  var nv=m[i]*f;removed+=m[i]-nv;m[i]=nv;
 }
 if(removed>0){
  var n=Math.min(7,Math.ceil(removed/2));
  for(var k=0;k<n;k++){var a=Math.random()*6.28,r=Math.random()*R;
   var cols=['#2f6a1c','#4d8a28','#7fb040','#1e4a14'];
   particles.push({x:px+Math.cos(a)*r,y:py+Math.sin(a)*r,vx:(Math.random()-.5)*60+(brush.dx||0)*20,vy:-Math.random()*40-10,s:1+Math.random()*2.2,l:1,c:cols[(Math.random()*4)|0]})}
  if(particles.length>260)particles.splice(0,particles.length-260);
  dirty=true;
 }
}

function pos(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 var p=pos(e);brush.down=true;brush.has=true;brush.x=p[0];brush.y=p[1];brush.dx=0;scrape(p[0],p[1]);hideHint()});
cv.addEventListener('pointermove',function(e){var p=pos(e);
 if(brush.down){var dx=p[0]-brush.x,dy=p[1]-brush.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/(R*.4)));
  brush.dx=Math.max(-3,Math.min(3,dx/8));
  for(var i=1;i<=steps;i++)scrape(brush.x+dx*i/steps,brush.y+dy*i/steps)}
 brush.x=p[0];brush.y=p[1];if(e.pointerType==='mouse')brush.has=true;dirty=true});
function up(e){brush.down=false;if(e.pointerType!=='mouse')brush.has=false;dirty=true;checkRead()}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'&&!brush.down){brush.has=false;dirty=true}});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});

var hint=document.getElementById('hint');
function hideHint(){if(touched)return;touched=true;hint.style.opacity=0;try{localStorage.setItem('mossedOverTouched','1')}catch(e){}}
if(touched)hint.style.opacity=0;

// reading progress: a stone is "read" when most of its lines are clear
function checkRead(){
 var st=stones[cur],m=st.moss,gw=S.gw,ok=0;
 st.lines.forEach(function(l){
  var x0=Math.floor(l.x0/CELL),x1=Math.ceil(l.x1/CELL),y0=Math.floor(l.y0/CELL),y1=Math.ceil(l.y1/CELL),s=0,n=0;
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){s+=m[y*gw+x]||0;n++}
  if(s/n<.18)ok++});
 if(ok>=st.lines.length&&!st.read){st.read=true;updateDots()}
}

var dotsEl=document.getElementById('dots');
POEMS.forEach(function(_,i){var b=document.createElement('button');b.setAttribute('aria-label','Stone '+(i+1));b.innerHTML='<i></i>';b.onclick=function(){go(i)};dotsEl.appendChild(b)});
function updateDots(){Array.prototype.forEach.call(dotsEl.children,function(b,i){b.className=(i===cur?'on ':'')+(stones[i].read?'done':'')})}
function go(i){cur=(i+stones.length)%stones.length;particles.length=0;buildStone();updateDots()}
document.getElementById('prev').onclick=function(){go(cur-1)};
document.getElementById('next').onclick=function(){go(cur+1)};
window.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});

var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){stones.forEach(function(s){s.moss=null});build()},150)});

var last=0;
function frame(t){
 var dt=Math.min(.05,(t-last)/1000||.016);last=t;
 gAcc+=dt;
 if(gAcc>.1){gAcc=0;if(grow())dirty=true}
 if(particles.length){dirty=true;
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.vy+=240*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.4;if(p.l<=0)particles.splice(i,1)}}
 if(dirty){renderMoss();draw();dirty=false}
 requestAnimationFrame(frame)}
build();updateDots();
// let a moss-covered start settle; optional demo hook
window.__mossDemo=function(){var st=stones[cur];var m=st.moss;
