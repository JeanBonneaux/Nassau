<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hyperlane</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060a}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#hud{position:fixed;top:12px;left:12px;max-width:calc(100vw - 150px);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.7);pointer-events:none;user-select:none;z-index:2;text-shadow:0 0 6px rgba(0,0,0,.6)}
#hud b{letter-spacing:.2em;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>HYPERLANE</b><br>move: steer · hold: boost · space: palette</div>
<script>
(function () {
  'use strict';

  var preview = /preview/.test(location.hash);
  var hud = document.getElementById('hud');
  if (preview) hud.style.display = 'none';

  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { antialias: false, depth: false, stencil: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { hud.textContent = 'WebGL unavailable in this browser'; return; }

  var VS = [
    'attribute vec2 aPos;',
    'void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'
  ].join('\n');

  var FS = [
    'precision highp float;',
    'uniform vec2 uRes;',
    'uniform float uTime;',
    'uniform vec2 uMouse;',
    'uniform float uBoost;',
    'uniform float uDist;',
    'uniform int uSteps;',
    'uniform int uPal;',

    'vec2 path(float z){',
    '  return vec2(sin(z*0.17)*1.6 + sin(z*0.31)*0.7, cos(z*0.13)*1.2);',
    '}',

    'float ribs2D(vec3 p){',
    '  float q2 = mod(p.z, 0.5) - 0.25;',
    '  float r2 = length(p.xy - path(p.z));',
    '  return max(abs(q2) - 0.04, abs(r2 - 2.2) - 0.15);',
    '}',
    'float scene(vec3 p, out float dRG){',
    '  vec2 c = path(p.z);',
    '  vec2 l = p.xy - c;',
    '  float r = length(l);',
    '  float a = atan(l.y, l.x);',
    '  float disp = 0.12*smoothstep(-0.3, 0.3, sin(a*6.0)*sin(p.z*1.5));',
    '  float dTube = 2.2 - r - disp;',
    '  float q = mod(p.z, 2.0) - 1.0;',
    '  float ribs = max(abs(q) - 0.08, abs(r - 2.2) - 0.15);',
    '  float g = mod(p.z, 12.0) - 6.0;',
    '  float gates = max(abs(r - 1.4) - 0.06, abs(g) - 0.09);',
    '  dRG = min(ribs, gates);',
    '  return 0.8*min(min(dTube, dRG), ribs2D(p));',
    '}',

    'vec3 calcN(vec3 p){',
    '  vec3 e1 = vec3( 1.0,-1.0,-1.0);',
    '  vec3 e2 = vec3(-1.0,-1.0, 1.0);',
    '  vec3 e3 = vec3(-1.0, 1.0,-1.0);',
    '  vec3 e4 = vec3( 1.0, 1.0, 1.0);',
    '  float h = 0.002;',
    '  float r1; float r2; float r3; float r4;',
    '  float s1 = scene(p + e1*h, r1);',
    '  float s2 = scene(p + e2*h, r2);',
    '  float s3 = scene(p + e3*h, r3);',
    '  float s4 = scene(p + e4*h, r4);',
    '  return normalize(e1*s1 + e2*s2 + e3*s3 + e4*s4 + vec3(1e-6));',
    '}',

    'vec3 hueRot(vec3 c, float a){',
    '  vec3 k = vec3(0.57735);',
    '  return c*cos(a) + cross(k, c)*sin(a) + k*dot(k, c)*(1.0 - cos(a));',
    '}',

    'void palette(int w, out vec3 A, out vec3 B, out vec3 C, out vec3 BG){',
    '  if (w == 1) {',
    '    A = vec3(1.0, 0.353, 0.212); B = vec3(1.0, 0.176, 0.529); C = vec3(1.0, 0.824, 0.247);',
    '    BG = vec3(0.078, 0.016, 0.059);',
    '  } else if (w == 2) {',
    '    A = vec3(0.224, 1.0, 0.078); B = vec3(0.0, 0.941, 0.745); C = vec3(1.0, 0.902, 0.0);',
    '    BG = vec3(0.016, 0.063, 0.043);',
    '  } else if (w == 3) {',
    '    A = vec3(0.478, 0.847, 1.0); B = vec3(0.706, 0.549, 1.0); C = vec3(1.0);',
    '    BG = vec3(0.016, 0.039, 0.118);',
    '  } else {',
    '    A = vec3(1.0, 0.169, 0.839); B = vec3(0.133, 0.902, 1.0); C = vec3(1.0, 0.69, 0.125);',
    '    BG = vec3(0.039, 0.024, 0.125);',
    '  }',
    '}',

    'void main(){',
    '  vec2 uv = (gl_FragCoord.xy*2.0 - uRes) / uRes.y;',
    '  vec2 scr = gl_FragCoord.xy / uRes;',
    '  vec3 A; vec3 B; vec3 C; vec3 BG;',
    '  palette(uPal, A, B, C, BG);',

    '  vec2 steer = (uMouse - 0.5) * 2.0;',
    '  float t = uDist;',
    '  vec2 ship = clamp(steer, -1.0, 1.0) * 0.6;',
    '  vec3 ro = vec3(path(t) + ship, t);',
    '  vec3 ta = vec3(path(t + 2.0), t + 2.0);',
    '  vec2 dp = path(t + 0.5) - path(t - 0.5);',
    '  float roll = dp.x*0.4 + steer.x*0.5;',

    '  vec3 cw0 = normalize(ta - ro);',
    '  vec3 cu0 = normalize(cross(vec3(0.0, 1.0, 0.0), cw0));',
    '  vec3 cv0 = cross(cw0, cu0);',
    '  vec3 cw = normalize(cw0 + cu0*sin(steer.x*0.5) + cv0*sin(steer.y*0.5));',
    '  vec3 upr = vec3(sin(roll), cos(roll), 0.0);',
    '  vec3 cu = normalize(cross(upr, cw));',
    '  vec3 cv = cross(cw, cu);',

    '  float beat = pow(max(sin(uTime*2.0), 0.0), 8.0);',
    '  float fz = 1.5 - 0.4*uBoost - 0.15*beat;',
    '  vec3 rd = normalize(uv.x*cu + uv.y*cv + fz*cw);',

    '  float tt = 0.0;',
    '  float hit = 0.0;',
    '  float dRG = 0.0;',
    '  vec3 gc = vec3(0.0);',
    '  for (int i = 0; i < 64; i++) {',
    '    if (i >= uSteps) break;',
    '    vec3 p = ro + rd*tt;',
    '    float d = scene(p, dRG);',
    '    float s = 0.5 + 0.5*sin(p.z*0.3 + uTime);',
    '    float dR2 = ribs2D(p);',
    '    gc += ((0.02/(0.03 + abs(dRG))) + (0.01/(0.03 + abs(dR2)))) * mix(A, B, s);',
    '    if (d < 0.002) { hit = 1.0; break; }',
    '    tt += d;',
    '    if (tt > 40.0) break;',
    '  }',

    '  vec3 bgc = BG*(0.75 + 0.5*scr.y);',
    '  vec3 col = bgc;',
    '  if (hit > 0.5) {',
    '    vec3 p = ro + rd*tt;',
    '    vec3 n = calcN(p);',
    '    float diff = max(dot(n, -rd), 0.0);',
    '    vec2 l = p.xy - path(p.z);',
    '    float a = atan(l.y, l.x);',
    '    scene(p, dRG);',
    '    float lat1 = smoothstep(0.90, 0.985, sin(a*6.0));',
    '    float lat2 = smoothstep(0.93, 0.995, cos(p.z*3.14159));',
    '    float gridE = max(lat1, lat2);',
    '    float isRib = step(dRG, 0.02);',
    '    vec3 base = mix(A, B, 0.5 + 0.5*sin(p.z*0.4 + a*2.0));',
    '    vec3 wall = BG*0.5 + base*0.035*diff;',
    '    vec3 emit = base*gridE*2.2;',
    '    vec3 ribC = mix(C, vec3(1.0), 0.9)*2.4;',
    '    col = mix(wall + emit, ribC, isRib) + C*pow(1.0 - diff, 5.0)*0.12;',
    '    float fog = exp(-tt*0.09);',
    '    col = mix(bgc, col, fog);',
    '  }',

    '  vec3 gr = hueRot(gc, 0.10);',
    '  vec3 gb = hueRot(gc, -0.10);',
    '  col += vec3(gr.r, gc.g, gb.b) * 0.06 * (1.0 + 0.5*uBoost);',
    '  col = hueRot(col, uBoost*0.25)*(1.0 - 0.3*uBoost);',
    '  col *= 0.96 + 0.04*sin(gl_FragCoord.y*2.0944);',
    '  vec2 vc = scr - 0.5;',
    '  col *= 1.0 - 0.6*dot(vc, vc);',
    '  col = 1.0 - exp(-max(col, 0.0)*1.4);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.bindAttribLocation(prog, 0, 'aPos');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'uRes');
  var uTime = gl.getUniformLocation(prog, 'uTime');
  var uMouse = gl.getUniformLocation(prog, 'uMouse');
  var uBoost = gl.getUniformLocation(prog, 'uBoost');
  var uDist = gl.getUniformLocation(prog, 'uDist');
  var uSteps = gl.getUniformLocation(prog, 'uSteps');
  var uPal = gl.getUniformLocation(prog, 'uPal');

  // ---- render scale (fraction of CSS px * DPR) ----
  var scale = preview ? 0.35 : 0.7;
  function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }
  function resize() {
    var w = Math.max(1, Math.round(window.innerWidth * dpr() * scale));
    var h = Math.max(1, Math.round(window.innerHeight * dpr() * scale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- input ----
  var px = 0.5, py = 0.5;          // pointer target, 0..1
  var lastPointerT = -999;         // sim time of last pointer activity
  var boostTarget = 0;
  var palette = 0;
  var T = 0, dist = 0, boost = 0, auto = 1;
  var mouse = { x: 0.5, y: 0.5 };

  function setPointer(e) {
    px = Math.min(1, Math.max(0, e.clientX / Math.max(1, window.innerWidth)));
    py = Math.min(1, Math.max(0, 1 - e.clientY / Math.max(1, window.innerHeight)));
    lastPointerT = T;
  }
  window.addEventListener('pointerdown', function (e) { setPointer(e); boostTarget = 1; });
  window.addEventListener('pointermove', setPointer);
  function release() { boostTarget = 0; }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); palette = (palette + 1) % 4; }
  });

  // ---- loop ----
  var last = performance.now();
  var ema = 16.7, lastAdapt = 0;
  var steps = preview ? 40 : 64;

  function frame(now) {
    requestAnimationFrame(frame);
    var raw = now - last;
    last = now;
    var dt = Math.min(raw / 1000, 1 / 30);
    T += dt;

    // adaptive render scale (not in preview)
    ema += (Math.min(raw, 100) - ema) * 0.1;
    if (!preview && T > 1.0 && T - lastAdapt > 0.5) {
      if (ema > 30 && scale > 0.31) { scale = Math.max(0.3, Math.round((scale - 0.1) * 10) / 10); resize(); lastAdapt = T; }
      else if (ema < 12 && scale < 0.89) { scale = Math.min(0.9, Math.round((scale + 0.1) * 10) / 10); resize(); lastAdapt = T; }
    }

    // autopilot blend: eases in after 3 s idle (and from the first frame)
    var autoTarget = (T - lastPointerT > 3) ? 1 : 0;
    auto += (autoTarget - auto) * (1 - Math.exp(-dt * 1.2));
    var ax = 0.5 + 0.42 * Math.sin(T * 0.31);
    var ay = 0.5 + 0.30 * Math.sin(T * 0.47 + 1.3);
    var tx = px * (1 - auto) + ax * auto;
    var ty = py * (1 - auto) + ay * auto;
    var k = 1 - Math.exp(-dt * 5);
    mouse.x += (tx - mouse.x) * k;
    mouse.y += (ty - mouse.y) * k;

    boost += (boostTarget - boost) * (1 - Math.exp(-dt * 6));
    dist += dt * 3.0 * (1.0 + 1.5 * boost);

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, T);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.uniform1f(uBoost, boost);
    gl.uniform1f(uDist, dist);
    gl.uniform1i(uSteps, steps);
    gl.uniform1i(uPal, palette);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
