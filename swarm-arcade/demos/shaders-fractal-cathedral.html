<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandelbox Cathedral</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab;}
  canvas:active{cursor:grabbing;}
  #hud{position:fixed;top:12px;left:12px;z-index:2;pointer-events:none;
       font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.7);
       text-shadow:0 0 6px rgba(0,0,0,.6);user-select:none;}
  #hud .t{letter-spacing:.14em;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="t">MANDELBOX CATHEDRAL</div><div>drag: orbit · hold: dive · wheel: morph · C: colour</div></div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const PREVIEW = /preview/.test(location.hash);
if (PREVIEW) hud.style.display = 'none';

const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false })
        || canvas.getContext('experimental-webgl');
if (!gl) { hud.textContent = 'WebGL unavailable'; console.error('WebGL not available'); return; }

/* ---------- shaders ---------- */
const VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FS = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;
uniform float uScale;
uniform float uDive;
uniform int   uIters;
uniform int   uSteps;
uniform vec3  uWarm;
uniform vec3  uCool;
uniform vec3  uHue;

float gTrap;

float DE(vec3 p){
  vec3 z = p; float dr = 1.0; float trap = 1e5;
  for (int i = 0; i < 7; i++){
    if (i >= uIters) break;
    z = clamp(z, -1.0, 1.0) * 2.0 - z;                 // box fold
    float r2 = max(dot(z, z), 1e-6);
    if (r2 < 0.25){ z *= 4.0; dr *= 4.0; }             // sphere fold
    else if (r2 < 1.0){ float k = 1.0 / r2; z *= k; dr *= k; }
    z = z * uScale + p; dr = dr * abs(uScale) + 1.0;
    trap = min(trap, length(z));                       // orbit trap
  }
  gTrap = trap;
  float d = length(z) / max(abs(dr), 1e-6);
  return max(d, 1e-5);
}

vec3 calcN(vec3 p, float e){
  vec3 ex = vec3(e, 0.0, 0.0), ey = vec3(0.0, e, 0.0), ez = vec3(0.0, 0.0, e);
  return normalize(vec3(DE(p + ex) - DE(p - ex),
                        DE(p + ey) - DE(p - ey),
                        DE(p + ez) - DE(p - ez)));
}

float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main(){
  vec2 q = gl_FragCoord.xy / uRes;
  vec2 p = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;

  /* background: deep gradient + sparse stars */
  vec3 bg = mix(vec3(0.0157, 0.0235, 0.051), vec3(0.043, 0.0745, 0.188), clamp(q.y * 0.8 + 0.1, 0.0, 1.0)) * 0.7;
  float sh = hash(floor(p * 140.0));
  float star = step(0.9966, sh) * (0.4 + 0.6 * fract(sh * 91.7));
  bg += star * vec3(0.8, 0.85, 1.0) * 0.45;

  /* cinematic orbit camera */
  float a = uTime * 0.05 + uMouse.x * 3.0;
  float b = 0.3 + uMouse.y * 0.8 - 0.4;
  float r = (4.75 + 1.25 * sin(uTime * 0.13)) * mix(1.0, 0.5, uDive);
  vec3 ta = vec3(sin(uTime * 0.11), cos(uTime * 0.09), sin(uTime * 0.07)) * 0.15;
  vec3 ro = r * vec3(cos(a) * cos(b), sin(b) * 0.6, sin(a) * cos(b));

  /* never start inside geometry: push the camera outward if the DE is tiny */
  float d0 = DE(ro);
  if (d0 < 0.2) ro += normalize(ro) * (0.2 - d0) * 2.0;

  vec3 fw = normalize(ta - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(p.x * rt + p.y * up + 1.6 * fw);

  /* bounding sphere radius 6 */
  float bq = dot(ro, rd);
  float cq = dot(ro, ro) - 36.0;
  float hq = bq * bq - cq;

  float hit = 0.0, tHit = 0.0, trapHit = 0.0, steps = 0.0, glow = 0.0;

  if (hq > 0.0){
    float sq = sqrt(hq);
    float t = max(-bq - sq, 0.0);
    float tEnd = -bq + sq;
    for (int i = 0; i < 72; i++){
      if (i >= uSteps) break;
      vec3 pos = ro + rd * t;
      float d = DE(pos);
      float eps = (uSteps < 50 ? 0.0028 : 0.0012) * t;   // looser hit test when the step budget is small (preview)
      glow += 0.006 / (1.0 + d * d * 50.0);
      if (d < eps){ hit = 1.0; tHit = t; trapHit = gTrap; break; }
      t += d * 0.9;
      steps += 1.0;
      if (t > tEnd) break;
    }
  }

  vec3 c = bg;
  if (hit > 0.5){
    vec3 pos = ro + rd * tHit;
    vec3 n = calcN(pos, 0.004 * tHit);
    float ao = clamp(1.0 - steps / float(uSteps), 0.0, 1.0);

    vec3 pal = 0.5 + 0.5 * cos(6.2831 * (trapHit * 0.15 + uHue + uTime * 0.01));
    vec3 base = mix(pal, uWarm, 0.35);
    base = mix(base, uCool, smoothstep(0.6, 0.05, trapHit) * 0.7);

    vec3 key = normalize(vec3(0.55, 0.8, 0.35) - rd * 0.6);   // warm key from camera-ish side
    float dif = clamp(dot(n, key), 0.0, 1.0);
    float fil = clamp(dot(n, -key), 0.0, 1.0);                 // cool fill from opposite
    float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 3.0);
    float spe = pow(clamp(dot(reflect(rd, n), key), 0.0, 1.0), 24.0);

    vec3 lit = uWarm * dif * 1.5 + uCool * fil * 0.6 + uCool * 0.03;
    c = base * lit * (0.12 + 0.88 * ao * ao) + uWarm * rim * 0.3 + vec3(1.0, 0.9, 0.7) * spe * 0.5;
    c = mix(c, bg * 0.5 + uCool * 0.05, (1.0 - exp(-tHit * 0.12)) * 0.7);
  }

  c += glow * 0.45 * mix(uCool, uWarm, 0.5);                    // subtle volumetric shimmer

  /* tone map, gamma, vignette, grain */
  c = 1.0 - exp(-c * 1.0);
  c = pow(c, vec3(0.4545));
  vec2 vq = q * (1.0 - q);
  c *= mix(0.3, 1.0, pow(16.0 * vq.x * vq.y, 0.25));
  c += (hash(gl_FragCoord.xy + fract(uTime * 7.0) * vec2(113.0, 71.0)) - 0.5) * 0.02;

  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('shader compile: ' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error('program link: ' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

/* fullscreen triangle */
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uTime','uMouse','uScale','uDive','uIters','uSteps','uWarm','uCool','uHue']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

/* ---------- palettes ---------- */
const PALS = [
  { warm: [0.910, 0.690, 0.290], cool: [0.122, 0.620, 0.588], hue: [0.0, 0.1, 0.2] },   // amber and teal
  { warm: [1.000, 0.420, 0.220], cool: [0.420, 0.200, 0.900], hue: [0.35, 0.0, 0.55] }, // ember and violet
  { warm: [0.960, 0.930, 0.780], cool: [0.200, 0.520, 0.880], hue: [0.55, 0.62, 0.72] } // ivory and glacier
];
const cur = { warm: PALS[0].warm.slice(), cool: PALS[0].cool.slice(), hue: PALS[0].hue.slice() };
let palIdx = 0;

/* ---------- sizing ---------- */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let scale = PREVIEW ? 0.3 : 0.45;
function resize(){
  const w = Math.max(2, Math.round(innerWidth * DPR * scale));
  const h = Math.max(2, Math.round(innerHeight * DPR * scale));
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}
window.addEventListener('resize', resize);
resize();

/* ---------- input ---------- */
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
let px = 0.5, py = 0.5, lastPtr = -1e9, pDown = false;
let autoMorph = true, manualScale = -1.8, morphS = -1.8;

function setPtr(e){
  px = clamp(e.clientX / innerWidth, 0, 1);
  py = clamp(1 - e.clientY / innerHeight, 0, 1);
  lastPtr = performance.now();
}
canvas.addEventListener('pointerdown', e => {
  setPtr(e); pDown = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
window.addEventListener('pointermove', setPtr);
const release = () => { pDown = false; };
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

function leaveAuto(){
  if (autoMorph){ autoMorph = false; manualScale = morphS; }
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  leaveAuto();
  manualScale = clamp(manualScale - e.deltaY * 0.0012, -2.4, -1.6);
}, { passive: false });
canvas.addEventListener('dblclick', () => {
  if (autoMorph) leaveAuto(); else autoMorph = true;
});
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'c' || k === 'C'){
    palIdx = (palIdx + 1) % PALS.length;
  } else if (k === '+' || k === '=' || k === '-' || k === '_'){
    leaveAuto();
    const step = (k === '-' || k === '_') ? -0.04 : 0.04;
    manualScale = clamp(manualScale + step, -2.4, -1.6);
  }
});

/* ---------- loop ---------- */
let simT = 0, lastNow = performance.now();
let blend = 1, dive = 0;
const mSm = [0.5, 0.5];
let avgMs = 16, adaptAcc = 0;

function adapt(rawMs){
  if (PREVIEW) return;
  avgMs = avgMs * 0.95 + rawMs * 0.05;
  adaptAcc += rawMs;
  if (adaptAcc < 1000) return;
  adaptAcc = 0;
  let s = scale;
  if (avgMs > 30) s = Math.max(0.25, s - 0.1);
  else if (avgMs < 12) s = Math.min(0.8, s + 0.1);
  if (Math.abs(s - scale) > 1e-6){ scale = Math.round(s * 100) / 100; resize(); }
}

function frame(now){
  requestAnimationFrame(frame);
  const rawMs = clamp(now - lastNow, 0, 200);
  lastNow = now;
  const dt = Math.min(rawMs / 1000, 1 / 30);
  simT += dt;
  adapt(rawMs);

  /* pointer steers; after 3 s idle the autopilot eases back in */
  const idle = (now - lastPtr) > 3000;
  blend += ((idle ? 1 : 0) - blend) * (1 - Math.exp(-dt * 1.6));
  const ax = 0.5 + 0.5 * Math.sin(simT * 0.09);
  const ay = 0.5 + 0.5 * Math.sin(simT * 0.061 + 1.3);
  const tx = px + (ax - px) * blend;
  const ty = py + (ay - py) * blend;
  const kM = 1 - Math.exp(-dt * 4);
  mSm[0] += (tx - mSm[0]) * kM;
  mSm[1] += (ty - mSm[1]) * kM;

  dive += ((pDown ? 1 : 0) - dive) * (1 - Math.exp(-dt * 5));

  /* fractal parameter: auto-morph or manual; both kept within [-2.4,-1.6] */
  const autoS = -1.8 - 0.2 * Math.sin(simT * 0.07);
  const goalS = autoMorph ? autoS : manualScale;
  morphS += (goalS - morphS) * (1 - Math.exp(-dt * 3));

  /* palette cross-fade */
  const P = PALS[palIdx];
  const kP = 1 - Math.exp(-dt * 2.2);
  for (let i = 0; i < 3; i++){
    cur.warm[i] += (P.warm[i] - cur.warm[i]) * kP;
    cur.cool[i] += (P.cool[i] - cur.cool[i]) * kP;
    cur.hue[i]  += (P.hue[i]  - cur.hue[i])  * kP;
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, simT);
  gl.uniform2f(U.uMouse, mSm[0], mSm[1]);
  gl.uniform1f(U.uScale, morphS);
  gl.uniform1f(U.uDive, dive);
  gl.uniform1i(U.uIters, PREVIEW ? 4 : 7);
  gl.uniform1i(U.uSteps, PREVIEW ? 36 : 72);
  gl.uniform3f(U.uWarm, cur.warm[0], cur.warm[1], cur.warm[2]);
  gl.uniform3f(U.uCool, cur.cool[0], cur.cool[1], cur.cool[2]);
  gl.uniform3f(U.uHue, cur.hue[0], cur.hue[1], cur.hue[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
