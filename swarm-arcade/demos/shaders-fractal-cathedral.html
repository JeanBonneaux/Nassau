<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRACTAL CATHEDRAL</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060a;}
  canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab;}
  canvas:active{cursor:grabbing;}
  #hud{position:fixed;top:12px;left:12px;z-index:2;pointer-events:none;
       font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:rgba(255,255,255,.7);
       text-shadow:0 0 6px rgba(0,0,0,.6);user-select:none;}
  #hud .t{letter-spacing:.14em;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="t">FRACTAL CATHEDRAL</div><div>drag: look · hold: speed · wheel: morph · C: colour</div></div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const PREVIEW = /preview/.test(location.hash);
if (PREVIEW) hud.style.display = 'none';

const gl = canvas.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false })
        || canvas.getContext('experimental-webgl');
if (!gl) { hud.textContent = 'WebGL unavailable'; console.error('WebGL not available'); return; }

/* ---------- shaders ---------- */
const VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FS = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;
uniform float uMorph;
uniform float uCamZ;
uniform float uRoll;
uniform float uDive;
uniform int   uIters;
uniform int   uSteps;
uniform vec3  uWarm;
uniform vec3  uCool;
uniform vec3  uHue;

/* infinite cross of three square beams, half-width 1 (negative inside) */
float sdCross(vec3 p){
  p = abs(p);
  return min(max(p.x, p.y), min(max(p.y, p.z), max(p.z, p.x))) - 1.0;
}

/* infinite Menger sponge: start solid everywhere, carve the cross holes at every level */
float DE(vec3 p){
  p += 0.12 * uMorph * vec3(sin(p.y * 1.3 + uTime * 0.3), sin(p.z * 1.1), sin(p.x * 1.2));
  float d = -1.0;
  float s = 1.0;
  for (int m = 0; m < 4; m++){
    if (m >= uIters) break;
    vec3 a = mod(p * s, 2.0) - 1.0;          // local cell in [-1,1]
    vec3 r = 3.0 * abs(a);                   // middle third  <=>  r < 1
    float c = sdCross(r) / (3.0 * s);        // negative inside a hole, world units
    d = max(d, -c);
    s *= 3.0;
  }
  return d;
}

vec3 calcN(vec3 p){
  const float e = 0.0015;
  return normalize(vec3(DE(p + vec3(e, 0.0, 0.0)) - DE(p - vec3(e, 0.0, 0.0)),
                        DE(p + vec3(0.0, e, 0.0)) - DE(p - vec3(0.0, e, 0.0)),
                        DE(p + vec3(0.0, 0.0, e)) - DE(p - vec3(0.0, 0.0, e))));
}

float hash3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float hash2(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main(){
  vec2 q = gl_FragCoord.xy / uRes;
  vec2 p = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;

  /* camera rides the channel x = y = 1 (a hole at every level), gentle sway, clamped inside the channel */
  float yaw = (uMouse.x - 0.5) * 1.2;                      // +-0.6 rad
  float pit = (uMouse.y - 0.5) * 1.0;                      // +-0.5 rad
  vec2 sway = vec2(0.10 * sin(uTime * 0.23) + 0.05 * sin(uTime * 0.61), 0.10 * cos(uTime * 0.17));
  vec2 off = clamp(sway + (uMouse - 0.5) * 0.2, -0.15, 0.15);
  vec3 ro = vec3(1.0 + off.x, 1.0 + off.y, uCamZ);
  float d0 = DE(ro);
  if (d0 < 0.05) ro.xy = mix(ro.xy, vec2(1.0), 0.5);       // safety: drift back to the channel axis

  vec3 fw = vec3(sin(yaw) * cos(pit), sin(pit), cos(yaw) * cos(pit));
  vec3 rt0 = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up0 = cross(rt0, fw);
  float cr = cos(uRoll), sr = sin(uRoll);
  vec3 rt = rt0 * cr + up0 * sr;
  vec3 up = up0 * cr - rt0 * sr;
  vec3 rd = normalize(p.x * rt + p.y * up + 1.6 * fw);

  vec3 fogCol = vec3(0.0275, 0.0706, 0.145);               // #071225
  vec3 c = mix(fogCol * 0.6, fogCol * 1.2, clamp(q.y, 0.0, 1.0));

  /* march */
  float t = 0.0, tHit = 0.0, steps = 0.0, glow = 0.0, hit = 0.0;
  for (int i = 0; i < 72; i++){
    if (i >= uSteps) break;
    vec3 pos = ro + rd * t;
    float d = DE(pos);
    glow += 0.02 / (1.0 + d * d * 80.0);
    if (d < 0.001 * t + 0.0005){ hit = 1.0; tHit = t; break; }
    t += d * 0.9;
    steps += 1.0;
    if (t > 40.0) break;
  }

  if (hit > 0.5){
    vec3 pos = ro + rd * tHit;
    vec3 n = calcN(pos);
    float ao = pow(clamp(1.0 - steps / float(uSteps), 0.0, 1.0), 2.0);

    vec3 key = normalize(rt * 0.4 + up * 0.8 - fw * 0.5);  // warm key, rotates with the camera
    float dif = clamp(dot(n, key), 0.0, 1.0);
    float fil = clamp(dot(n, -key), 0.0, 1.0);              // cool fill from the opposite side

    vec3 toEye = ro - pos;
    float tl = max(length(toEye), 1e-4);
    float lamp = clamp(dot(n, toEye / tl), 0.0, 1.0) / (1.0 + 0.15 * tHit * tHit);  // warm light at the camera

    float mixK = 0.5 + 0.5 * sin(dot(pos, vec3(0.7, 1.3, 0.9)));
    vec3 base = mix(uCool, uWarm, 0.15 + 0.7 * mixK) * 0.9;
    float blk = hash3(floor(pos * 0.5));
    base *= mix(vec3(1.0), 0.5 + 0.5 * cos(6.2831 * (uHue + blk)), 0.12);  // per-block tint

    vec3 lit = uWarm * dif * 1.5 + uCool * fil * 0.55 + uWarm * lamp * 0.6 + uCool * 0.05;
    c = base * lit * (0.03 + 0.97 * ao);

    float fogK = exp(-tHit * 0.08);
    c = mix(fogCol, c, fogK);
  }

  c += glow * 0.12 * mix(uCool, uWarm, 0.7);               // near-miss glow / light shafts

  /* tone map, gamma, vignette, grain */
  c = 1.0 - exp(-c * 1.2);
  c = pow(c, vec3(0.4545));
  vec2 vq = q * (1.0 - q);
  c *= mix(0.35, 1.0, pow(16.0 * vq.x * vq.y, 0.3));
  c += (hash2(gl_FragCoord.xy + fract(uTime * 7.0) * vec2(113.0, 71.0)) - 0.5) * 0.015;

  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('shader compile: ' + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error('program link: ' + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

/* fullscreen triangle */
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uTime','uMouse','uMorph','uCamZ','uRoll','uDive','uIters','uSteps','uWarm','uCool','uHue']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

/* ---------- palettes ---------- */
const PALS = [
  { warm: [1.0, 0.52, 0.18], cool: [0.12, 0.38, 0.80], hue: [0.0, 0.1, 0.2] },   // amber and teal
  { warm: [1.000, 0.420, 0.220], cool: [0.420, 0.200, 0.900], hue: [0.35, 0.0, 0.55] }, // ember and violet
  { warm: [0.960, 0.930, 0.780], cool: [0.200, 0.520, 0.880], hue: [0.55, 0.62, 0.72] } // ivory and glacier
];
const cur = { warm: PALS[0].warm.slice(), cool: PALS[0].cool.slice(), hue: PALS[0].hue.slice() };
let palIdx = 0;

/* ---------- sizing ---------- */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let scale = PREVIEW ? 0.5 : 0.55;
function resize(){
  const w = Math.max(2, Math.round(innerWidth * DPR * scale));
  const h = Math.max(2, Math.round(innerHeight * DPR * scale));
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}
window.addEventListener('resize', resize);
resize();

/* ---------- input ---------- */
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
let px = 0.5, py = 0.5, lastPtr = -1e9, pDown = false;
let autoMorph = true, manualMorph = 0.5, morphS = 0.5;

function setPtr(e){
  px = clamp(e.clientX / innerWidth, 0, 1);
  py = clamp(1 - e.clientY / innerHeight, 0, 1);
  lastPtr = performance.now();
}
canvas.addEventListener('pointerdown', e => {
  setPtr(e); pDown = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
window.addEventListener('pointermove', setPtr);
const release = () => { pDown = false; };
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

function leaveAuto(){
  if (autoMorph){ autoMorph = false; manualMorph = morphS; }
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  leaveAuto();
  manualMorph = clamp(manualMorph - e.deltaY * 0.001, 0, 1);
}, { passive: false });
canvas.addEventListener('dblclick', () => {
  if (autoMorph) leaveAuto(); else autoMorph = true;
});
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'c' || k === 'C'){
    palIdx = (palIdx + 1) % PALS.length;
  } else if (k === '+' || k === '=' || k === '-' || k === '_'){
    leaveAuto();
    const step = (k === '-' || k === '_') ? -0.04 : 0.04;
    manualMorph = clamp(manualMorph + step, 0, 1);
  }
});

/* ---------- loop ---------- */
let simT = 0, lastNow = performance.now();
let blend = 1, dive = 0, camZ = 0;
const mSm = [0.5, 0.5];
let avgMs = 16, adaptAcc = 0;

function adapt(rawMs){
  avgMs = avgMs * 0.95 + rawMs * 0.05;
  adaptAcc += rawMs;
  if (adaptAcc < 1000) return;
  adaptAcc = 0;
  let s = scale;
  if (avgMs > 30) s = Math.max(PREVIEW ? 0.3 : 0.35, s - 0.1);
  else if (avgMs < 12) s = Math.min(0.85, s + 0.1);
  if (Math.abs(s - scale) > 1e-6){ scale = Math.round(s * 100) / 100; resize(); }
}

function frame(now){
  requestAnimationFrame(frame);
  const rawMs = clamp(now - lastNow, 0, 200);
  lastNow = now;
  const dt = Math.min(rawMs / 1000, 1 / 30);
  simT += dt;
  adapt(rawMs);

  /* pointer steers; after 3 s idle the autopilot eases back in */
  const idle = (now - lastPtr) > 3000;
  blend += ((idle ? 1 : 0) - blend) * (1 - Math.exp(-dt * 1.6));
  const ax = 0.5 + 0.5 * Math.sin(simT * 0.09);
  const ay = 0.5 + 0.5 * Math.sin(simT * 0.061 + 1.3);
  const tx = px + (ax - px) * blend;
  const ty = py + (ay - py) * blend;
  const kM = 1 - Math.exp(-dt * 4);
  mSm[0] += (tx - mSm[0]) * kM;
  mSm[1] += (ty - mSm[1]) * kM;

  /* hold to speed up (dive) */
  dive += ((pDown ? 1 : 0) - dive) * (1 - Math.exp(-dt * 5));
  camZ += dt * 0.6 * (1 + dive);

  /* morph: auto or manual, both within [0,1] */
  const autoM = 0.5 + 0.5 * Math.sin(simT * 0.1);
  const goalM = autoMorph ? autoM : manualMorph;
  morphS += (goalM - morphS) * (1 - Math.exp(-dt * 3));

  /* palette cross-fade */
  const P = PALS[palIdx];
  const kP = 1 - Math.exp(-dt * 2.2);
  for (let i = 0; i < 3; i++){
    cur.warm[i] += (P.warm[i] - cur.warm[i]) * kP;
    cur.cool[i] += (P.cool[i] - cur.cool[i]) * kP;
    cur.hue[i]  += (P.hue[i]  - cur.hue[i])  * kP;
  }

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, simT);
  gl.uniform2f(U.uMouse, mSm[0], mSm[1]);
  gl.uniform1f(U.uMorph, morphS);
  gl.uniform1f(U.uCamZ, camZ);
  gl.uniform1f(U.uRoll, 0.15 * Math.sin(simT * 0.05) * blend);
  gl.uniform1f(U.uDive, dive);
  gl.uniform1i(U.uIters, PREVIEW ? 3 : 4);
  gl.uniform1i(U.uSteps, PREVIEW ? 40 : 72);
  gl.uniform3f(U.uWarm, cur.warm[0], cur.warm[1], cur.warm[2]);
  gl.uniform3f(U.uCool, cur.cool[0], cur.cool[1], cur.cool[2]);
  gl.uniform3f(U.uHue, cur.hue[0], cur.hue[1], cur.hue[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
