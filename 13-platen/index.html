<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platen</title>
<meta name="description" content="A tactile typewriter with a margin bell, no backspace and a two-colour ribbon. Overstrike, roll the platen by half lines, and make typewriter art.">
<style>
:root{--bg:#2a2622;--steel:#3b3631;--key:#e9e2d2;--keytop:#f6f1e4;--ink:#1d1a17;--red:#b3261e;--accent:#d8a24a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#e9e2d2;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none;touch-action:manipulation}
header{display:flex;align-items:center;gap:6px;padding:2px 8px;min-height:46px;flex:none}
header a,header button{white-space:nowrap;font:inherit;font-size:16px;color:#e9e2d2;background:#3b3631;border:1px solid #554e46;border-radius:10px;min-height:44px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}
header a{background:none;border-color:transparent;padding:0 6px;opacity:.8}
header .sp{flex:1}
#ribbon i{width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid #e9e2d2;display:inline-block}
#ribbon.red i{background:var(--red)}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#kb{flex:none;background:linear-gradient(#35302b,#26221e);border-top:2px solid #4a433b;padding:8px 2px 8px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;justify-content:center}
.k{flex:0 0 calc(10% - 0px);height:46px;padding:2px;display:block}
.k b{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%/50%;border-radius:23px;background:radial-gradient(circle at 35% 30%,#fffdf6,var(--key) 70%);color:#222;font:600 19px ui-monospace,Menlo,"Courier New",monospace;border:3px solid #3a342d;box-shadow:0 3px 0 #17140f,0 4px 5px rgba(0,0,0,.5);transition:transform .04s,box-shadow .04s;pointer-events:none}
.k.down b{transform:translateY(3px);box-shadow:0 0 0 #17140f}
.k.fn b{white-space:nowrap;background:radial-gradient(circle at 35% 30%,#6a615a,#4a433c 70%);color:#f3ead7;font-size:17px;border-radius:12px}
.k.fn.on b{background:radial-gradient(circle at 35% 30%,#e9bb68,#c28a2e);color:#2a1d05}
.k.sp b{border-radius:14px;color:#777;font-size:13px;letter-spacing:.15em}
.k small{position:absolute}
.w3{flex-basis:30%}.w2{flex-basis:20%}
#hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:16px;color:#cdbf9f;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<header>
  <a href="../index.html">← Gallery</a>
  <span class="sp"></span>
  <button id="ribbon" aria-label="Switch ribbon colour"><i></i>Ribbon</button>
  <button id="show">Demo</button>
  <button id="fresh">New</button>
</header>
<div id="stage"><canvas id="c"></canvas><div id="hint">Tap the keys. There is no backspace.</div></div>
<div id="kb"></div>
<script>
(()=>{
"use strict";
const COLS=28, BELL=23;
const cv=document.getElementById('c'), g=cv.getContext('2d');
const kb=document.getElementById('kb'), hint=document.getElementById('hint');
let W=0,H=0,dpr=1,cw=12,lh=24,half=12,typeY=0,x0=0;
let strikes=[], col=0, hy=4, viewHy=4, ribbonRed=false, shift=false, flash=null, auto=null, ver=0;
let wear=0;
const SHIFT={'1':'!','2':'?','3':'#','4':'$','5':'*','6':'&','7':'_','8':'(','9':')','0':'/',',':';','.':':','-':"'"};
/* ---------- audio ---------- */
let ac=null, noise=null, muted=false;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();
    const n=ac.sampleRate*0.3|0, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1; noise=b;}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
  return ac;
}
function burst(t,f,q,dur,vol,type){
  const s=ac.createBufferSource(); s.buffer=noise;
  const fl=ac.createBiquadFilter(); fl.type=type||'bandpass'; fl.frequency.value=f; fl.Q.value=q;
  const v=ac.createGain(); v.gain.setValueAtTime(vol,t); v.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(fl);fl.connect(v);v.connect(ac.destination); s.start(t,Math.random()*0.1,dur+0.02);
}
function thump(t,f0,f1,dur,vol){
  const o=ac.createOscillator(),v=ac.createGain(); o.type='sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  v.gain.setValueAtTime(vol,t); v.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+dur+0.02);
}
function sKey(){ if(!audio()||muted)return; const t=ac.currentTime, r=Math.random();
  burst(t,2200+r*1800,1.2,0.03,0.55); thump(t,150+r*40,55,0.08,0.5); burst(t+0.022,900+r*500,2,0.05,0.22); }
function sSpace(){ if(!audio()||muted)return; const t=ac.currentTime;
  thump(t,95,45,0.11,0.6); burst(t,700,1,0.05,0.3); }
function sJam(){ if(!audio()||muted)return; const t=ac.currentTime;
  thump(t,70,40,0.1,0.6); burst(t,400,1,0.05,0.4); }
function sDing(){ if(!audio()||muted)return; const t=ac.currentTime+0.01;
  [[1,0.35],[2.76,0.18],[5.4,0.08],[8.9,0.04]].forEach(([m,a])=>{
    const o=ac.createOscillator(),v=ac.createGain(); o.type='sine'; o.frequency.value=1760*m*(0.999+Math.random()*0.002);
    v.gain.setValueAtTime(a,t); v.gain.exponentialRampToValueAtTime(0.0005,t+1.9/Math.sqrt(m));
    o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+2); }); }
function sReturn(){ if(!audio()||muted)return; const t=ac.currentTime;
  for(let i=0;i<14;i++){ burst(t+i*0.022,3500-i*60,3,0.014,0.28); }
  burst(t+0.34,500,1,0.07,0.5); thump(t+0.34,110,45,0.12,0.6); }
function sRoll(){ if(!audio()||muted)return; const t=ac.currentTime; burst(t,2800,4,0.025,0.3); burst(t+0.03,2400,4,0.02,0.2);}
function sTear(){ if(!audio()||muted)return; const t=ac.currentTime; burst(t,3000,0.5,0.35,0.5,'highpass'); }
/* ---------- layout ---------- */
function resize(){
  const st=document.getElementById('stage'); dpr=Math.min(window.devicePixelRatio||1,3);
  W=st.clientWidth;H=st.clientHeight; cv.width=W*dpr;cv.height=H*dpr;
  cw=Math.min(12,(W-16)/(COLS+3)); lh=cw*2; half=cw; x0=(W-COLS*cw)/2; typeY=Math.round(H*0.7); draw();
}
const sy=h=>typeY+(h-viewHy)*half;
/* ---------- drawing ---------- */
function draw(){
  g.setTransform(dpr,0,0,dpr,0,0);
  const bg=g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#1f1c19'); bg.addColorStop(1,'#2d2924');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  const pw=(COLS+3)*cw, px=(W-pw)/2, top=sy(-5);
  g.save(); g.shadowColor='rgba(0,0,0,.55)'; g.shadowBlur=18; g.shadowOffsetY=4;
  g.fillStyle='#f1e9d6'; g.fillRect(px,top,pw,H-top+10); g.restore();
  // paper grain
  const pg=g.createLinearGradient(px,0,px+pw,0); pg.addColorStop(0,'rgba(0,0,0,.05)');pg.addColorStop(.08,'rgba(0,0,0,0)');pg.addColorStop(.92,'rgba(0,0,0,0)');pg.addColorStop(1,'rgba(0,0,0,.06)');
  g.fillStyle=pg; g.fillRect(px,top,pw,H-top);
  g.font=`${(cw*1.62).toFixed(1)}px "Courier New",ui-monospace,Menlo,monospace`;
  g.textAlign='center'; g.textBaseline='alphabetic';
  const lo=-lh*2, hi=H+lh;
  for(const s of strikes){
    const y=sy(s.hy); if(y<lo||y>hi)continue;
    g.save(); g.translate(x0+(s.col+0.5)*cw+s.dx, y+s.dy+cw*0.5); g.rotate(s.rot);
    g.globalAlpha=s.ink; g.fillStyle=s.red?'#a3231b':'#1b1815'; g.fillText(s.c,0,0);
    if(s.ink>0.6){g.globalAlpha=(s.ink-0.4)*0.35; g.fillText(s.c,0.4,0.2);}
    g.restore();
  }
  if(flash){const a=1-(performance.now()-flash.t)/140; if(a>0){
    g.save();g.globalAlpha=a*0.5;g.fillStyle=flash.red?'#a3231b':'#1b1815';
    const s=1+a*0.35; g.translate(x0+(flash.col+0.5)*cw,sy(flash.hy)+cw*0.5); g.scale(s,s); g.fillText(flash.c,0,0); g.restore();} else flash=null;}
  // guide bar
  const cx=x0+(col+0.5)*cw, by=typeY+cw*1.05;
  const bar=g.createLinearGradient(0,by,0,by+13); bar.addColorStop(0,'#8d8780');bar.addColorStop(.4,'#55504a');bar.addColorStop(1,'#2a2622');
  g.fillStyle=bar; g.fillRect(0,by,cx-cw*0.62,13); g.fillRect(cx+cw*0.62,by,W-cx-cw*0.62,13);
  g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(0,by,W,1);
  // scale ticks and bell marker
  g.fillStyle='rgba(255,255,255,.45)';
  for(let i=0;i<=COLS;i++){ const x=x0+i*cw; g.fillRect(x,by+(i%5?10:7),1,i%5?3:6); }
  g.fillStyle='#d8a24a'; const bx=x0+BELL*cw; g.fillRect(bx-1,by-3,3,8);
  // notch pointer
  g.fillStyle='#d8a24a'; g.beginPath(); g.moveTo(cx,by-1); g.lineTo(cx-5,by-9); g.lineTo(cx+5,by-9); g.closePath(); g.fill();
  // platen roller at bottom
  const rl=g.createLinearGradient(0,H-26,0,H); rl.addColorStop(0,'#111');rl.addColorStop(.35,'#4a4540');rl.addColorStop(.6,'#1a1816');rl.addColorStop(1,'#0a0908');
  g.fillStyle=rl; g.fillRect(0,H-26,W,26);
  for(let x=((-viewHy*half*0.0)%9);x<W;x+=9){g.fillStyle='rgba(255,255,255,.04)';g.fillRect(x,H-26,1,26);}
  // knob hint
  const kg=g.createLinearGradient(0,0,12,0);
}
function loop(){
  const d=hy-viewHy;
  if(Math.abs(d)>0.01){viewHy+=d*0.22; if(Math.abs(hy-viewHy)<0.02)viewHy=hy; draw();}
  else if(flash)draw();
  requestAnimationFrame(loop);
}
/* ---------- typing ---------- */
function strike(c,quiet){
  const jam=col>=COLS; const cc=Math.min(col,COLS-1);
  wear=Math.max(0,wear-0.02);
  const ink=Math.min(0.97,(0.62+Math.random()*0.3)*(c==='.'||c===','||c===':'||c===';'||c==="'"?1:1) - (c==='_'?0.05:0));
  const s={c,col:cc,hy,dx:(Math.random()-.5)*1.1,dy:(Math.random()-.5)*1.6,rot:(Math.random()-.5)*0.06,ink,red:ribbonRed};
  strikes.push(s); flash={c,col:cc,hy,t:performance.now(),red:ribbonRed};
  if(!quiet){ if(jam)sJam(); else sKey(); }
  if(!jam){ col++; if(col===BELL&&!quiet)setTimeout(sDing,60); }
  draw();
}
function pressChar(raw){
  if(hint.style.opacity!=='0')hint.style.opacity='0';
  let c=raw;
  if(shift){ c=SHIFT[raw]||raw.toUpperCase(); setShift(false); }
  strike(c);
}
function space(){ if(col<COLS){col++; if(col===BELL)setTimeout(sDing,60);} sSpace(); draw(); }
function ret(){ col=0; hy=Math.min(hy+2,400); sReturn(); }
function moveX(d){ const n=Math.max(0,Math.min(COLS,col+d)); if(n!==col){col=n;sRoll();draw();} }
function moveY(d){ const n=Math.max(0,Math.min(400,hy+d)); if(n!==hy){hy=n;sRoll();} }
function setShift(v){ shift=v; const b=document.querySelector('[data-k="shift"]'); if(b)b.classList.toggle('on',v); }
/* ---------- keyboard UI ---------- */
const rows=[
 ['1','2','3','4','5','6','7','8','9','0'],
 ['q','w','e','r','t','y','u','i','o','p'],
 ['a','s','d','f','g','h','j','k','l'],
 ['z','x','c','v','b','n','m',',','.','-'],
];
function mk(label,cls,key){
  const el=document.createElement('div'); el.className='k '+(cls||''); el.dataset.k=key;
  el.innerHTML='<b></b>'; el.firstChild.textContent=label; return el;
}
rows.forEach(r=>{ const d=document.createElement('div'); d.className='row'; r.forEach(k=>d.appendChild(mk(k,'',k))); kb.appendChild(d); });
{ const d=document.createElement('div'); d.className='row';
  [['⇧','fn','shift'],['◀','fn','left'],['▲','fn','up'],['SPACE','sp w3','space'],['▼','fn','down'],['▶','fn','right'],['Return ⏎','fn w2','ret']].forEach(a=>d.appendChild(mk(...a)));
  kb.appendChild(d);}
const keyLabels={};
function refreshLabels(){ kb.querySelectorAll('.k').forEach(e=>{const k=e.dataset.k; if(k.length===1){e.firstChild.textContent=shift?(SHIFT[k]||k.toUpperCase()):k;}}); }
const origSetShift=setShift; setShift=function(v){origSetShift(v);refreshLabels();};
function act(k){
  if(auto)return;
  if(k==='shift')setShift(!shift);
  else if(k==='space')space();
  else if(k==='ret')ret();
  else if(k==='left')moveX(-1); else if(k==='right')moveX(1);
  else if(k==='up')moveY(-1); else if(k==='down')moveY(1);
  else pressChar(k);
}
kb.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.k'); if(!el)return; e.preventDefault(); audio();
  el.classList.add('down'); act(el.dataset.k);
  const rel=()=>el.classList.remove('down'); el.addEventListener('pointerup',rel,{once:true}); el.addEventListener('pointercancel',rel,{once:true}); el.addEventListener('pointerleave',rel,{once:true});
});
kb.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  let k=null;
  if(e.key==='Enter')k='ret'; else if(e.key===' ')k='space';
  else if(e.key==='ArrowLeft')k='left'; else if(e.key==='ArrowRight')k='right';
  else if(e.key==='ArrowUp')k='up'; else if(e.key==='ArrowDown')k='down';
  else if(e.key==='Backspace'){ e.preventDefault(); sJam(); return; }
  else if(e.key.length===1){
    const ch=e.key; audio();
    if(auto)return;
    if(hint.style.opacity!=='0')hint.style.opacity='0';
    strike(ch.length&&/[A-Za-z0-9.,;:'"!?#$*&_()\/\-]/.test(ch)?ch:(ch==='%'||ch==='@'||ch==='+'||ch==='='?ch:' ')); e.preventDefault();return;
  }
  if(k){e.preventDefault(); audio(); act(k);} 
});
/* ---------- header buttons ---------- */
const rb=document.getElementById('ribbon');
rb.addEventListener('click',()=>{ audio(); ribbonRed=!ribbonRed; rb.classList.toggle('red',ribbonRed); sRoll(); });
document.getElementById('fresh').addEventListener('click',()=>{
  audio(); stopAuto(); sTear(); strikes=[]; col=0; hy=4; viewHy=-6; draw(); setShift(false); hint.style.opacity=1; });
/* ---------- auto-typed picture ---------- */
const showBtn=document.getElementById('show');
function stopAuto(){ if(auto){clearTimeout(auto.t); auto=null; showBtn.textContent='Demo';} }
function moonJobs(){
  // a moon, shaded in two passes of overstrike, then a caption
  const R=5.4, cxm=14, cym=0, ramp=' .:-=+*#@';
  const cells=[];
  for(let r=0;r<=11;r++){
    for(let c=0;c<COLS;c++){
      const dx=(c+0.5-cxm)/(R*2.05), dy=(r-5.5+0.5)/R; // cell aspect ~1:2
      const d=Math.hypot(dx,dy); if(d>1)continue;
      // light from upper-left
      const nz=Math.sqrt(Math.max(0,1-d*d)), lx=-0.55,ly=-0.5,lz=0.67;
      let l=Math.max(0,(dx*lx+dy*ly+nz*lz)); l=Math.pow(l,0.9);
      // craters
      for(const [ex,ey,er] of [[0.25,0.15,0.2],[-0.3,0.35,0.13],[0.1,-0.45,0.1],[0.45,-0.25,0.08]]){
        const dd=Math.hypot(dx-ex,dy-ey); if(dd<er)l*=0.45+0.5*(dd/er); if(Math.abs(dd-er)<0.035)l*=0.8; }
      cells.push({r,c,l,rim:d>0.86});
    }
  }
  const jobs=[];
  const ones=['.',':','o','O','0','@'];
  // pass 1: base tone, shadow side dense, lit side light (reverse: paper is white, so dark ink = shadow)
  for(let r=0;r<=11;r++)for(const cl of cells.filter(x=>x.r===r)){
    const dark=1-cl.l; const i=Math.min(8,Math.round(dark*6)); if(cl.rim){jobs.push({r,c:cl.c,ch:i>3?'O':'o'});continue;} if(i<=1)continue;
    jobs.push({r,c:cl.c,ch:ramp[Math.max(1,Math.ceil(i/2))]});
  }
  // pass 2: overstrike heavier marks where shadow is deepest
  for(let r=0;r<=11;r++)for(const cl of cells.filter(x=>x.r===r)){
    const dark=1-cl.l; if(dark<0.5||cl.rim)continue;
    jobs.push({r,c:cl.c,ch:dark>0.75?'#':dark>0.58?'*':'+',second:true});
  }
  // stars on the right and left
  const stars=[[1,2,'*'],[3,25,'.'],[5,1,'.'],[2,27,'+'],[9,26,'*'],[10,1,'+'],[0,22,'.'],[11,25,'.'],[11,3,'*']];
  return {jobs,stars};
}
function startShow(){
  if(auto){stopAuto();return;}
  audio();
  const {jobs,stars}=moonJobs();
  // start on a fresh stretch of paper: go below current content
  let lastHy=strikes.reduce((m,s)=>Math.max(m,s.hy),0);
  const base=strikes.length? Math.ceil((lastHy+4)/2)*2 : 4;
  const list=[];
  // pass 1 rows, pass 2 rows are separate sweeps
  const p1=jobs.filter(j=>!j.second), p2=jobs.filter(j=>j.second);
  stars.forEach(([r,c,ch])=>list.push({r,c,ch,star:true}));
  list.sort((a,b)=>a.r-b.r||a.c-b.c);
  const seq=[...p1,...p2,...list.filter(x=>x.star)];
  // type caption
  const cap='good night';
  const capStart=Math.floor((COLS-cap.length)/2);
  for(let i=0;i<cap.length;i++)seq.push({r:13,c:capStart+i,ch:cap[i],cap:true});
  showBtn.textContent='Stop';
  hy=base; col=0;
  let i=0; auto={t:0};
  const step=()=>{
    if(!auto)return;
    if(i>=seq.length){ stopAuto(); hy=base+28; col=0; return; }
    const j=seq[i++]; hy=base+j.r*2; col=j.c;
    const quiet=(i%2===0)&&!j.cap;
    strike(j.ch,true); if(!quiet){ if(audio()&&!muted){sKey();} }
    hint.style.opacity=0;
    auto.t=setTimeout(step, j.cap?150:(j.second?14:12)+Math.random()*10);
  };
  step();
}
showBtn.addEventListener('click',startShow);
/* ---------- init ---------- */
function prefill(){
  const lines=['Dear stranger,','','this page is yours.','Strike a key, hear the bell','near the right-hand margin,','then press Return.'];
  lines.forEach((t,r)=>{ for(let c=0;c<t.length;c++){ if(t[c]!==' ')strikes.push({c:t[c],col:c,hy:4+r*2,dx:(Math.random()-.5)*1.1,dy:(Math.random()-.5)*1.6,rot:(Math.random()-.5)*0.06,ink:0.65+Math.random()*0.3,red:r===0}); }});
  hy=4+lines.length*2; col=0; viewHy=hy;
}
prefill(); resize(); addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
requestAnimationFrame(loop);
window.__platen={get strikes(){return strikes.length}};
})();
</script>
</body>
</html>
