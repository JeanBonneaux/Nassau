<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dépenses">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Dépenses</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, .10);
  --wash: rgba(11, 11, 11, .05);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --track: #cde2fb;
  --good-text: #006300;
  --bad-text: #d03b3b;
  --warn: #fab219;
  --warn-text: #a15c00;
  --critical: #d03b3b;
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, .10);
    --wash: rgba(255, 255, 255, .06);
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --track: #184f95;
    --good-text: #0ca30c;
    --bad-text: #f07272;
    --warn-text: #fab219;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink); font: 15px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(96px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
.app { max-width: 560px; margin: 0 auto; padding: 0 14px; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 10px 0 8px; }
.title-row { display: flex; align-items: center; justify-content: space-between; }
h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--wash); }
.icon-btn svg { width: 22px; height: 22px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.month-row { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.month-row .label { font-weight: 600; min-width: 9.5em; text-align: center; text-transform: capitalize; }
.month-row .icon-btn { width: 34px; height: 34px; }
.month-row .icon-btn:disabled { opacity: .3; cursor: default; background: none; }

.banner { margin: 4px 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--wash); color: var(--ink-2); font-size: 13.5px; display: flex; gap: 8px; align-items: flex-start; }
.banner.alert { color: var(--bad-text); background: rgba(208, 59, 59, .08); }
.banner button { margin-left: auto; border: 0; background: none; color: var(--accent-ink); font-weight: 600; padding: 0; white-space: nowrap; }

main { transition: opacity .2s; }
main.loading { opacity: .55; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; position: relative; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.sub { color: var(--ink-2); font-size: 13.5px; }

/* checklist */
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.step .mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--wash); color: var(--ink-2); }
.step.done .mark { background: var(--good-text); color: #fff; }
.step.bad .mark { background: var(--critical); color: #fff; }
.step b { display: block; }
.step .sub { margin-top: 2px; }
.step ol { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.step li { margin: 3px 0; }
.step .btns { margin-top: 8px; }

/* summary */
.hero-label { color: var(--ink-2); font-size: 14px; }
.hero { font-size: 52px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; margin: 2px 0 6px; overflow-wrap: anywhere; }
.delta { font-size: 14px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.delta.up { color: var(--bad-text); }
.delta.down { color: var(--good-text); }
.delta.flat { color: var(--ink-2); }
.facts { margin-top: 6px; color: var(--ink-2); font-size: 13.5px; }
.meter { margin-top: 14px; position: relative; }
.meter-track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.meter-fill { height: 100%; border-radius: 4px; background: var(--accent); }
.meter.warn .meter-fill { background: var(--warn); }
.meter.over .meter-fill { background: var(--critical); }
.meter-tick { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink-2); border-radius: 1px; }
.meter-label { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13.5px; color: var(--ink-2); }
.meter.warn .meter-label b { color: var(--warn-text); }
.meter.over .meter-label b { color: var(--bad-text); }

/* daily chart */
.chart { position: relative; min-height: 140px; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .tick.today { fill: var(--ink); font-weight: 700; }
.chart .bar { fill: var(--accent); }
.chart .bar.dim { opacity: .45; }
.chart .cursor { stroke: var(--axis); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; z-index: 3; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); font-size: 13px; white-space: nowrap; transform: translate(-50%, -100%); }
.tip b { display: block; font-size: 15px; }
.tip span { color: var(--ink-2); }
details.table-view { margin-top: 8px; font-size: 13.5px; }
details.table-view summary { color: var(--accent-ink); cursor: pointer; }
table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 0; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; }

/* categories */
.cats { display: grid; gap: 2px; }
.cat { display: grid; grid-template-columns: minmax(7.5em, 38%) 1fr; align-items: center; gap: 10px; width: calc(100% + 12px); border: 0; background: none; padding: 7px 6px; margin: 0 -6px; border-radius: 8px; text-align: left; }
.cat:hover { background: var(--wash); }
.cat.on { background: var(--wash); box-shadow: inset 3px 0 0 var(--accent); }
.cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-track { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cat-bar { height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); flex: none; min-width: 2px; }
.cat-val { font-size: 13.5px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat-pct { color: var(--ink-2); font-size: 12.5px; }

/* insights */
.kv { display: grid; gap: 6px; font-size: 14px; }
.kv .line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.kv .line span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .line b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv .muted { color: var(--ink-2); font-size: 12.5px; }
.up { color: var(--bad-text); } .down { color: var(--good-text); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--wash); color: var(--ink-2); margin-left: 6px; }
.pill.warn { color: var(--warn-text); }

/* list */
.list-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.seg { display: inline-flex; background: var(--wash); border-radius: 10px; padding: 2px; }
.seg button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.search { flex: 1 1 140px; min-width: 0; border: 1px solid var(--border); background: var(--page); border-radius: 10px; padding: 7px 10px; font-size: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 2px; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--wash); border: 0; font-size: 13.5px; }
.chip span { color: var(--ink-2); }
.day { display: flex; justify-content: space-between; margin: 14px 0 2px; font-size: 13px; color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.day:first-child { margin-top: 6px; }
.row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; width: calc(100% + 12px); border: 0; background: none; padding: 8px 6px; margin: 0 -6px; border-radius: 10px; text-align: left; }
.row:hover { background: var(--wash); }
.row .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--wash); display: grid; place-items: center; font-size: 17px; }
.row .main { min-width: 0; }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.row .amt small { display: block; font-weight: 500; font-size: 11.5px; color: var(--ink-2); }
.row.muted .amt { color: var(--ink-2); font-weight: 500; }
.row.dup .amt span { text-decoration: line-through; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--wash); color: var(--ink-2); margin-left: 4px; vertical-align: 1px; }
.badge.warn { color: var(--warn-text); }
.raw { color: var(--ink-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.review-item { padding: 10px 0; border-top: 1px solid var(--grid); }
.review-item:first-child { border-top: 0; padding-top: 0; }
.review-item .why { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 6px; }
.btn.small { padding: 7px 12px; font-size: 13.5px; }
.empty { color: var(--ink-2); text-align: center; padding: 22px 8px; font-size: 14px; }
.foot { color: var(--ink-2); font-size: 12.5px; text-align: center; margin: 4px 0 0; }

/* welcome */
.welcome h2 { font-size: 20px; }
.welcome ol { padding-left: 20px; margin: 8px 0 14px; color: var(--ink-2); }
.welcome li { margin: 6px 0; }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--wash); color: var(--ink); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { color: var(--bad-text); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btns .spacer { flex: 1; }

.fab { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; box-shadow: 0 6px 20px rgba(42, 120, 214, .35); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }

/* sheets */
dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, 100vw); max-height: min(92vh, 92dvh); border-radius: 18px 18px 0 0; margin: auto auto 0; box-shadow: 0 -8px 40px rgba(0,0,0,.25); }
@media (min-width: 620px) { dialog { border-radius: 18px; margin: auto; } }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
.sheet { padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: inherit; }
.sheet h2 { font-size: 19px; margin-bottom: 14px; }
.sheet h3 { font-size: 14px; margin: 18px 0 8px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field > span { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); background: var(--page); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 96px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 12px; font-size: 14.5px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.preview { border-radius: 12px; background: var(--wash); padding: 10px 12px; margin-bottom: 12px; font-size: 14px; min-height: 44px; }
.preview b { font-size: 16px; }
.hint { font-size: 12.5px; color: var(--ink-2); margin: -6px 0 12px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; color: var(--ink-2); }
.copyrow { display: flex; gap: 8px; }
.copyrow input { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--ink-2); }
.copyrow .btn { padding: 8px 14px; }
.qr { background: #fff; border-radius: 12px; padding: 10px; margin: 8px auto 12px; max-width: 280px; }
.qr svg { display: block; width: 100%; height: auto; }
.rules { display: grid; gap: 4px; font-size: 14px; }
.rule { display: flex; gap: 8px; align-items: center; }
.rule span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rule button { border: 0; background: none; color: var(--ink-2); font-size: 16px; padding: 4px 8px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="title-row">
      <h1>Dépenses</h1>
      <div>
        <button class="icon-btn" id="syncBtn" aria-label="Actualiser" title="Actualiser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" aria-label="Réglages" title="Réglages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="month-row" id="monthRow">
      <button class="icon-btn" id="prevMonth" aria-label="Mois précédent">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="label" id="monthLabel" aria-live="polite"></span>
      <button class="icon-btn" id="nextMonth" aria-label="Mois suivant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="main"></main>
</div>
<button class="fab" id="addBtn" aria-label="Ajouter une transaction" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet" id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var P = SpendParser;
  var I = typeof SpendInsights !== 'undefined' ? SpendInsights : null;
  var VERSION = '0.3.1';          // doit suivre la version du script (VERSION dans backend.gs)
  var GUIDE_URL = 'https://jeanculess.github.io/Nassau/guide.html';
  var LS = { settings: 'depenses.settings.v3', cache: 'depenses.cache.v3', demo: 'depenses.demo.v3', applied: 'depenses.setup.v3' };
  var TYPE_LABEL = { purchase: 'Achat', refund: 'Remboursement', cash: 'Retrait', fee: 'Frais', income: 'Revenu', transfer: 'Virement' };
  var REASON_LABEL = { 'no-amount': 'Aucun montant', 'not-a-spend': 'Solde ou récompense', promo: 'Promotion', declined: 'Refusée', upcoming: 'À venir', statement: 'Relevé', empty: 'Vide', raccourci: 'Raccourci mal configuré', 'rate-limit': 'Trop de notifications', suspect: 'Courriel suspect', other: 'Autre' };
  var CHANNEL_LABEL = { phone: 'iPhone', email: 'courriel', manual: 'saisie', paste: 'texte collé', statement: 'relevé', applepay: 'Apple Pay', sheet: 'feuille' };
  var BANK_LABEL = { scotia: 'Scotia', capitalone: 'Capital One', wealthsimple: 'Wealthsimple', cartes: 'Cartes', desjardins: 'Desjardins', rbc: 'RBC', td: 'TD', bmo: 'BMO', cibc: 'CIBC', tangerine: 'Tangerine' };
  var ICONS = {};
  var CAT_FR = {};
  P.CATEGORIES.forEach(function (c) { ICONS[c.name] = c.icon; CAT_FR[c.name] = c.fr || c.name; });
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = !!navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  var $ = function (s, el) { return (el || document).querySelector(s); };
  var main = $('#main');

  var state = {
    settings: loadSettings(),
    data: empty(),
    month: startOfMonth(new Date()),
    view: 'all',
    q: '',
    cat: '',
    syncing: false,
    lastSync: 0,
    error: ''
  };

  /* ------------------------------------------------------------ réglages locaux */

  function loadSettings() {
    var s = {};
    try { s = JSON.parse(localStorage.getItem(LS.settings)) || {}; } catch (e) { s = {}; }
    return { url: s.url || '', token: s.token || '', demo: !!s.demo, hideChecklist: !!s.hideChecklist };
  }
  function saveSettings() { localStorage.setItem(LS.settings, JSON.stringify(state.settings)); }
  function connected() { return !!(state.settings.url && state.settings.token); }
  function validUrl(u) { return /^https:\/\/\S+$/.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(u); }
  function live() { return connected() && !state.settings.demo; }

  // Le lien de configuration (#setup=…) transporte l'adresse et le jeton vers un autre navigateur ou l'app de l'écran d'accueil.
  function decodeSetup(text) {
    var m = /[#&]setup=([A-Za-z0-9_-]+)/.exec(text || '');
    if (!m) return null;
    try {
      var s = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
      return s && typeof s === 'object' && s.u && s.k ? { key: m[1], s: s } : null;
    } catch (e) { return null; }
  }
  function applySetupHash() {
    if (!/[#&]setup=/.test(location.hash)) return;
    var d = decodeSetup(location.hash);
    if (!d) { toast('Ce lien de configuration est incomplet'); return; }
    if (localStorage.getItem(LS.applied) !== d.key) {
      state.settings.url = d.s.u;
      state.settings.token = d.s.k;
      state.settings.demo = false;
      saveSettings();
      localStorage.setItem(LS.applied, d.key);
      toast('Connecté à votre feuille');
    }
    // Sur l'iPhone, dans Safari, le lien reste dans l'adresse : l'icône « Sur l'écran d'accueil » l'emporte avec elle
    // (l'app de l'écran d'accueil a sa propre mémoire). Partout ailleurs, le jeton ne reste pas dans l'historique.
    if (!(isIOS && !standalone)) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* rien */ }
    }
  }
  function setupLink() {
    var s = { u: state.settings.url, k: state.settings.token, c: mainCurrency() };
    var enc = btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return location.href.split('#')[0] + '#setup=' + enc;
  }
  function shortcutUrl() {
    if (state.data.shortcutUrl) return state.data.shortcutUrl;
    if (state.data.captureToken && state.settings.url) return state.settings.url + (state.settings.url.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(state.data.captureToken);
    return '';
  }
  function copyText(text, input, done) {
    var fallback = function () {
      if (input) { input.focus(); input.select(); try { if (document.execCommand('copy')) { toast(done); return; } } catch (e) { /* refusé */ } }
      prompt('Copiez ceci', text);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(done); }, fallback);
    else fallback();
  }

  /* ------------------------------------------------------------ données */

  function empty() { return { transactions: [], ignored: [], rules: [], currency: '', sheetUrl: '', captureToken: '', shortcutUrl: '', settings: {}, health: {}, version: '' }; }
  function setData(d) {
    state.data = {
      transactions: (d.transactions || []).map(hydrate).filter(function (t) { return t._d; }).sort(function (a, b) { return b._d - a._d; }),
      ignored: (d.ignored || []).map(function (x) { x._d = x.captured_at ? new Date(x.captured_at) : null; return x; }),
      rules: d.rules || [],
      currency: d.currency || 'CAD',
      sheetUrl: d.sheetUrl || '',
      captureToken: d.captureToken || '',
      shortcutUrl: d.shortcutUrl || '',
      settings: d.settings || {},
      health: d.health || {},
      version: d.version || ''
    };
  }
  function hydrate(t) {
    t._d = t.date ? new Date(t.date) : null;
    if (t._d && isNaN(t._d)) t._d = null;
    t.amount = Number(t.amount) || 0;
    return t;
  }
  function plain(d) {
    var c = {};
    Object.keys(d).forEach(function (k) { c[k] = d[k]; });
    c.transactions = d.transactions.map(strip);
    c.ignored = d.ignored.map(strip);
    return c;
  }
  function strip(o) { var c = {}; Object.keys(o).forEach(function (k) { if (k.charAt(0) !== '_') c[k] = o[k]; }); return c; }
  function persist() {
    var payload = plain(state.data);
    if (!state.settings.demo) payload.savedAt = state.lastSync;
    try { localStorage.setItem(state.settings.demo ? LS.demo : LS.cache, JSON.stringify(payload)); } catch (e) { /* plein */ }
  }

  /* ------------------------------------------------------------ format */

  var nfCache = {};
  function nf(cur, compact) {
    var key = cur + (compact ? 'c' : '');
    if (!nfCache[key]) {
      var opts = { style: 'currency', currency: cur, currencyDisplay: cur === mainCurrency() ? 'narrowSymbol' : 'symbol' };
      if (compact) { opts.notation = 'compact'; opts.maximumFractionDigits = 1; }
      try { nfCache[key] = new Intl.NumberFormat('fr-CA', opts); } catch (e) { nfCache[key] = new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD' }); }
    }
    return nfCache[key];
  }
  function money(n, cur) { return nf(cur || mainCurrency()).format(n); }
  function moneyCompact(n, cur) { return n < 1000 ? nf(cur, false).format(n).replace(/[.,]00(?=\D*$)/, '') : nf(cur, true).format(n); }
  var dfMonth = new Intl.DateTimeFormat('fr-CA', { month: 'long', year: 'numeric' });
  var dfMonthOnly = new Intl.DateTimeFormat('fr-CA', { month: 'long' });
  var dfDay = new Intl.DateTimeFormat('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' });
  var dfTime = new Intl.DateTimeFormat('fr-CA', { hour: 'numeric', minute: '2-digit' });
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function mainCurrency() { return state.data.currency || 'CAD'; }
  function catLabel(c) { return CAT_FR[c] || c || 'Autre'; }
  function reasonLabel(r) {
    var m = /^(.*?) \(claude\)$/.exec(r || '');
    return m ? (REASON_LABEL[m[1]] || m[1]) + ' (relu par Claude)' : (REASON_LABEL[r] || r);
  }
  function sourceLabel(src) {
    var p = String(src || '').split(':');
    var chan = CHANNEL_LABEL[p[0]] || p[0];
    var bank = BANK_LABEL[p[1]] || p[1];
    return bank ? bank + ' · ' + chan : chan;
  }
  function plural(n, s) {
    if (n <= 1 || /s$/.test(s)) return n + ' ' + s;
    return n + ' ' + s.split(' ').map(function (w) { return /[sxz]$/.test(w) ? w : w + 's'; }).join(' ');
  }

  /* ------------------------------------------------------------ dates */

  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }
  function daysIn(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
  function sameMonth(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); }
  function dayKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dayLabel(d) {
    var today = new Date();
    var y = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
    if (dayKey(d) === dayKey(today)) return 'Aujourd’hui · ' + dfDay.format(d);
    if (dayKey(d) === dayKey(y)) return 'Hier · ' + dfDay.format(d);
    return dfDay.format(d);
  }
  function toLocalInput(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function inMonth(d, m) { return d && d >= m && d < addMonths(m, 1); }
  function ago(ts) {
    var s = Math.round((Date.now() - new Date(ts).getTime()) / 1000);
    if (!isFinite(s)) return '';
    if (s < 60) return 'à l’instant';
    if (s < 3600) return 'il y a ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'il y a ' + Math.round(s / 3600) + ' h';
    return 'il y a ' + plural(Math.round(s / 86400), 'jour');
  }
  function daysSince(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : Infinity; }

  /* ------------------------------------------------------------ réseau */

  // Tout passe en POST : le jeton n'apparaît jamais dans une adresse. text/plain évite la pré-vérification CORS,
  // à laquelle Apps Script ne sait pas répondre.
  function api(action, payload, cfg) {
    var s = cfg || state.settings;
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 25000);
    var body = Object.assign({}, payload || {}, { action: action, token: s.token });
    return fetch(s.url, { method: 'POST', body: JSON.stringify(body), signal: ctrl && ctrl.signal }).then(function (res) {
      if (!res.ok) throw new Error('La feuille a répondu HTTP ' + res.status);
      return res.text();
    }).then(function (text) {
      var data;
      try { data = JSON.parse(text); } catch (e) {
        throw new Error('Réponse inattendue. Le script est-il déployé avec l’accès « Tout le monde » ?');
      }
      if (!data.ok) throw new Error(data.error || 'La demande a échoué');
      return data;
    }, function (err) {
      throw new Error(err && err.name === 'AbortError' ? 'La feuille met trop de temps à répondre' : (err.message || 'Erreur de réseau'));
    }).finally(function () { clearTimeout(timer); });
  }

  function sync(quiet) {
    if (!live() || state.syncing) return Promise.resolve();
    state.syncing = true;
    renderChrome();
    return api('list').then(function (d) {
      setData(d);
      state.lastSync = Date.now();
      state.error = '';
      persist();
    }).catch(function (err) {
      state.error = err.message;
      if (!quiet) toast(err.message);
    }).finally(function () {
      state.syncing = false;
      render();
    });
  }

  function loadLocal() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(state.settings.demo ? LS.demo : LS.cache)); } catch (e) { raw = null; }
    if (state.settings.demo && !raw) raw = makeDemo();
    if (raw) {
      setData(raw);
      state.lastSync = raw.savedAt || 0;
      if (state.settings.demo) persist();
    } else {
      setData({});
    }
  }

  // On applique le changement à l'écran, puis on le confirme avec la feuille (les exemples restent locaux).
  // Si la feuille refuse, l'écran revient en arrière et la feuille est relue.
  function mutate(apply, action, payload, onServer) {
    var before = { transactions: state.data.transactions.map(function (t) { return Object.assign({}, t); }), rules: state.data.rules.slice(), ignored: state.data.ignored.slice() };
    apply();
    render();
    if (!live()) { persist(); return Promise.resolve(); }
    return api(action, payload).then(function (res) {
      return Promise.resolve(onServer ? onServer(res) : null).then(function () {
        persist();
        render();
        return res;
      });
    }).catch(function (err) {
      state.data.transactions = before.transactions;
      state.data.rules = before.rules;
      state.data.ignored = before.ignored;
      render();
      toast('Non enregistré : ' + err.message);
      return sync(true);
    });
  }
  function replaceTx(tx) {
    var t = hydrate(tx);
    var list = state.data.transactions;
    var i = list.findIndex(function (x) { return x.id === t.id; });
    if (i >= 0) list[i] = t; else list.push(t);
    list.sort(function (a, b) { return b._d - a._d; });
  }
  function findTx(id) { return state.data.transactions.find(function (x) { return x.id === id; }); }

  /* ------------------------------------------------------------ calculs */

  function monthTx(m) { return state.data.transactions.filter(function (t) { return inMonth(t._d, m); }); }
  function counts(t) { return P.countsAsSpending(t); }
  function spendingIn(list, cur) {
    var s = 0;
    list.forEach(function (t) { if (counts(t) && t.currency === cur) s += t.amount; });
    return s;
  }
  function budget() { return Number(state.data.settings.budget) || 0; }
  function checklist() {
    var h = state.data.health || {};
    var misconfigured = h.misconfiguredAt && daysSince(h.misconfiguredAt) < 2 && !(h.lastPhoneAt && h.lastPhoneAt > h.misconfiguredAt);
    return {
      connected: live() && (state.lastSync > 0 || state.data.transactions.length > 0),
      home: !isIOS || standalone,
      shortcut: !!(h.shortcutPingAt || h.lastPhoneAt) && !misconfigured,
      misconfigured: !!misconfigured
    };
  }

  /* ------------------------------------------------------------ rendu */

  function render() {
    renderChrome();
    var setUp = connected() || state.settings.demo;
    $('#addBtn').hidden = !setUp;
    $('#monthRow').hidden = !setUp;
    if (!setUp) { renderWelcome(); return; }
    var cur = mainCurrency();
    var mt = monthTx(state.month);
    var typing = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.selectionStart : -1;
    nfCache = {};
    var reviewAll = state.data.transactions.filter(function (t) { return t.status === 'review'; });
    main.innerHTML =
      '<section class="card" id="checklist" hidden></section>' +
      '<section class="card" id="summary"></section>' +
      (reviewAll.length ? '<section class="card" id="review"></section>' : '') +
      '<section class="card"><h2>Dépenses par jour</h2><div class="chart" id="daily"></div><div id="dailyTable"></div></section>' +
      '<section class="card"><h2>Par catégorie</h2><div class="cats" id="cats"></div></section>' +
      '<section class="card" id="insights" hidden></section>' +
      '<section class="card"><div class="list-head" id="listHead"></div><div id="chipRow"></div><div id="list"></div></section>' +
      '<p class="foot" id="foot"></p>';
    renderChecklist();
    renderSummary(mt, cur);
    if (reviewAll.length) renderReview(reviewAll, cur);
    renderDaily(mt, cur);
    renderCats(mt, cur);
    renderInsights(mt, cur);
    renderList(mt, cur);
    renderFoot();
    if (typing >= 0) {
      var q = $('#q');
      q.focus();
      try { q.setSelectionRange(typing, typing); } catch (e) { /* type=search */ }
    }
  }

  function renderChrome() {
    $('#monthLabel').textContent = dfMonth.format(state.month);
    $('#nextMonth').disabled = sameMonth(state.month, new Date()) || state.month > new Date();
    $('#syncBtn').classList.toggle('spin', state.syncing);
    $('#syncBtn').hidden = !live();
    main.classList.toggle('loading', state.syncing && state.data.transactions.length > 0);
    var b = $('#banner');
    var msg = '';
    var action = '';
    var alert = false;
    var h = state.data.health || {};
    if (state.settings.demo) {
      msg = 'Exemples : rien ici n’est réel.';
      action = connected() ? '<button data-act="leave-demo">Voir ma feuille</button>' : '<button data-act="settings">Connecter</button>';
    } else if (live() && state.error) {
      msg = (state.lastSync ? 'Données ' + (ago(state.lastSync) === 'à l’instant' ? 'de l’instant' : 'd’' + ago(state.lastSync)) + '. ' : '') + state.error;
      action = '<button data-act="sync">Réessayer</button>';
    } else if (live() && checklist().misconfigured) {
      msg = 'Le raccourci envoie les mots « Titre » ou « Corps » au lieu des notifications : chaque valeur doit être une pastille bleue.';
      action = '<button data-act="settings">Voir comment</button>';
      alert = true;
    } else if (live() && h.lastStaleAt && daysSince(h.lastStaleAt) < 7) {
      msg = 'Votre raccourci utilise encore l’ancien lien : ses notifications ne sont pas enregistrées.';
      action = '<button data-act="settings">Copier le nouveau lien</button>';
      alert = true;
    } else if (live() && h.lastPhoneAt && daysSince(h.lastPhoneAt) > (Number(state.data.settings.heartbeatDays) || 3)) {
      msg = 'Rien de l’iPhone depuis ' + plural(Math.floor(daysSince(h.lastPhoneAt)), 'jour') + '. L’automatisation est-elle toujours activée ?';
      alert = true;
    } else if (live() && state.data.version && state.data.version < VERSION) {
      msg = 'Une mise à jour du script est disponible (' + VERSION + ', vous avez ' + state.data.version + ').';
      action = '<a href="' + GUIDE_URL + '#mise-a-jour" target="_blank" rel="noopener">Comment faire</a>';
    } else if (live() && state.data.settings && state.data.settings.triggers === false) {
      msg = 'Le déclencheur automatique n’est pas installé : pas de lecture des courriels ni de résumé du lundi. Relancez setup dans Apps Script et acceptez toutes les autorisations.';
      alert = true;
    }
    b.hidden = !msg;
    b.classList.toggle('alert', alert);
    b.innerHTML = msg ? '<span>' + esc(msg) + '</span>' + action : '';
  }

  function renderWelcome() {
    main.innerHTML =
      '<section class="card welcome">' +
      '<h2>Vos dépenses, à partir des notifications de vos banques</h2>' +
      '<p class="sub">Chaque notification d’achat de vos applis bancaires est envoyée par un raccourci iPhone vers une feuille Google qui vous appartient. Cette page lit cette feuille. Rien ne passe par un autre serveur.</p>' +
      '<ol>' +
      '<li>Sur un ordinateur : créer la feuille Google et y coller le script (10 min).</li>' +
      '<li>Ouvrir cette page depuis l’onglet <b>Configuration</b> de la feuille, puis la passer à l’iPhone par code QR.</li>' +
      '<li>Sur l’iPhone : une automatisation dans Raccourcis (5 min).</li>' +
      '</ol>' +
      '<div class="btns"><button class="btn primary" data-act="settings">Connecter ma feuille</button>' +
      '<button class="btn" data-act="demo">Voir avec des exemples</button></div>' +
      '<p class="sub" style="margin-top:14px"><a href="' + GUIDE_URL + '" target="_blank" rel="noopener">Lire le guide d’installation</a></p>' +
      '</section>';
  }

  var checklistWasOpen = false;
  function renderChecklist() {
    var box = $('#checklist');
    if (!live() || state.settings.hideChecklist) return;
    var c = checklist();
    if (c.connected && c.home && c.shortcut) {
      if (checklistWasOpen) { checklistWasOpen = false; toast('Tout est prêt ✓ Les achats apparaîtront ici au fil des notifications.'); }
      return;
    }
    checklistWasOpen = true;
    var h = state.data.health || {};
    function step(n, done, bad, title, body) {
      return '<div class="step' + (done ? ' done' : bad ? ' bad' : '') + '"><span class="mark">' + (done ? '✓' : bad ? '!' : n) + '</span><div><b>' + title + '</b>' + (done ? '' : body) + '</div></div>';
    }
    box.hidden = false;
    box.innerHTML = '<h2>Il reste quelques étapes</h2><div class="steps">' +
      step(1, c.connected, false, 'Feuille connectée', '<div class="sub">⚙ Réglages → collez le « Lien de configuration » de l’onglet Configuration de la feuille.</div>') +
      step(2, c.home, false, 'Sur l’écran d’accueil', '<div class="sub">Dans Safari : ••• (en bas à droite) → Partager → « Sur l’écran d’accueil » → Ajouter. Ouvrez ensuite l’icône Dépenses : elle s’ouvre déjà connectée. Sinon, copiez le lien ci-dessous et collez-le dans ses Réglages.</div>' +
        '<div class="btns"><button class="btn small" data-act="copy-setup">Copier le lien de configuration</button></div>') +
      step(3, c.shortcut, c.misconfigured, 'Raccourci relié',
        (c.misconfigured ? '<div class="sub" style="color:var(--bad-text)">Le raccourci envoie les mots « Titre », « Sous-titre » ou « Corps » (reçu ' + esc(ago(h.misconfiguredAt)) + '). Dans l’action « Obtenir le contenu de l’URL », chaque valeur doit être une variable choisie avec « Sélectionner une variable », pas un mot tapé.</div>' : '') +
        '<ol>' +
        '<li>Copiez le lien ci-dessous.</li>' +
        '<li>Raccourcis → nouvelle automatisation « Quand je reçois une notification de » : choisissez vos applis bancaires (et Cartes), sans filtre, exécution immédiate.</li>' +
        '<li>Action « Obtenir le contenu de l’URL » : collez le lien · Méthode POST · Corps JSON · trois champs Texte <code>titre</code>, <code>soustitre</code>, <code>corps</code>, chacun rempli avec la variable (pastille bleue) Titre, Sous-titre, Corps.</li>' +
        '<li>Touchez ▶ (en bas de l’éditeur) : cette carte disparaît. Si l’iPhone demande d’autoriser la connexion, choisissez « Toujours autoriser ».</li>' +
        '</ol>' +
        '<div class="btns"><button class="btn primary" data-act="copy-shortcut"' + (shortcutUrl() ? '' : ' disabled') + '>Copier le lien du raccourci</button>' +
        (isIOS ? '<a class="btn" href="shortcuts://">Ouvrir Raccourcis</a>' : '') +
        '<a class="btn" href="' + GUIDE_URL + '#iphone" target="_blank" rel="noopener">Guide détaillé</a></div>') +
      '</div>';
  }

  function renderSummary(mt, cur) {
    var now = new Date();
    var isCurrent = sameMonth(state.month, now);
    var total = spendingIn(mt, cur);
    var count = mt.filter(function (t) { return counts(t) && t.currency === cur; }).length;
    var delta = '';
    if (I) {
      var cmp = I.compareMonths(state.data.transactions, cur, state.month.getFullYear(), state.month.getMonth(), now);
      var prevName = dfMonthOnly.format(addMonths(state.month, -1));
      if (cmp.previous > 0 && (cmp.current > 0 || !isCurrent)) {
        var pct = cmp.deltaPct;
        var when = cmp.samePoint ? ' à ce stade' : '';
        if (Math.abs(pct) < 0.5) delta = '<div class="delta flat">Comme en ' + esc(prevName) + when + '</div>';
        else if (pct > 0) delta = '<div class="delta up"><span aria-hidden="true">▲</span> ' + Math.round(pct) + ' % de plus qu’en ' + esc(prevName) + when + '</div>';
        else delta = '<div class="delta down"><span aria-hidden="true">▼</span> ' + Math.round(-pct) + ' % de moins qu’en ' + esc(prevName) + when + '</div>';
      }
    }
    var facts = [plural(count, 'transaction')];
    var day = isCurrent ? now.getDate() : daysIn(state.month);
    if (count) facts.push(money(total / day, cur) + ' par jour');
    if (isCurrent && day >= 5 && daysIn(state.month) - day >= 3 && total > 0) facts.push('à ce rythme : ' + money(total / day * daysIn(state.month), cur));

    var meter = '';
    var b = budget();
    if (b > 0) {
      var ratio = total / b;
      var expected = isCurrent ? b * day / daysIn(state.month) : b;
      var projected = isCurrent ? total / day * daysIn(state.month) : total;
      var cls = total > b ? 'over' : projected > b && isCurrent ? 'warn' : '';
      var label = total > b
        ? '<b>Budget dépassé</b> de ' + money(total - b, cur) + ' (budget ' + money(b, cur) + ')'
        : '<b>' + Math.round(ratio * 100) + ' %</b> du budget de ' + money(b, cur) + ' · ' + money(b - total, cur) + ' restants' +
          (cls === 'warn' ? ' · <b>à ce rythme, dépassé</b>' : '');
      meter = '<div class="meter ' + cls + '" role="meter" aria-valuemin="0" aria-valuemax="' + b + '" aria-valuenow="' + total.toFixed(2) + '" aria-label="Budget utilisé">' +
        '<div class="meter-track"><div class="meter-fill" style="width:' + Math.min(100, ratio * 100).toFixed(1) + '%"></div></div>' +
        (isCurrent ? '<div class="meter-tick" style="left:' + Math.min(100, expected / b * 100).toFixed(1) + '%" title="Attendu aujourd’hui"></div>' : '') +
        '<div class="meter-label">' + label + '</div></div>';
    }
    var others = {};
    mt.forEach(function (t) { if (counts(t) && t.currency !== cur) others[t.currency] = (others[t.currency] || 0) + t.amount; });
    var otherTxt = Object.keys(others).map(function (c) { return money(others[c], c); }).join(' + ');
    $('#summary').innerHTML =
      '<div class="hero-label">Dépensé en ' + esc(dfMonthOnly.format(state.month)) + '</div>' +
      '<div class="hero">' + esc(money(total, cur)) + '</div>' + delta +
      '<div class="facts">' + esc(facts.join(' · ')) + '</div>' +
      (otherTxt ? '<div class="facts">Plus ' + esc(otherTxt) + ' dans d’autres devises (hors graphiques)</div>' : '') + meter;
  }

  function renderReview(list, cur) {
    var box = $('#review');
    if (!box) return;
    var shown = list.slice(0, 5);
    box.innerHTML = '<h2>À vérifier <span class="pill warn">' + list.length + '</span></h2>' + shown.map(function (t) {
      return '<div class="review-item" data-review="' + esc(t.id) + '">' +
        '<div style="display:flex;justify-content:space-between;gap:10px"><b>' + esc(t.merchant || 'Marchand inconnu') + '</b><b style="white-space:nowrap">' + esc(money(Math.abs(t.amount), t.currency)) + '</b></div>' +
        '<div class="why">' + esc([dfDay.format(t._d), catLabel(t.category), t.note || (t.merchant ? 'Lecture incertaine' : 'Marchand non trouvé')].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="btns"><button class="btn small primary" data-act="confirm" data-id="' + esc(t.id) + '">✓ C’est bon</button>' +
        '<button class="btn small" data-act="dup" data-id="' + esc(t.id) + '">Doublon</button>' +
        '<button class="btn small" data-act="edit" data-id="' + esc(t.id) + '">Modifier</button></div></div>';
    }).join('') + (list.length > shown.length ? '<p class="sub" style="margin:8px 0 0">' + (list.length - shown.length) + ' de plus dans l’onglet « À vérifier ».</p>' : '');
  }

  function niceMax(v) {
    if (!(v > 0)) return 10;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 4, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i] * mag) return steps[i] * mag;
    return 10 * mag;
  }
  function barPath(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, h, w / 2));
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'A' + r + ',' + r + ' 0 0 1 ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'A' + r + ',' + r + ' 0 0 1 ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  function renderDaily(mt, cur) {
    var host = $('#daily');
    var days = daysIn(state.month);
    var totals = [];
    var cnts = [];
    for (var i = 0; i < days; i++) { totals.push(0); cnts.push(0); }
    mt.forEach(function (t) { if (counts(t) && t.currency === cur) { var k = t._d.getDate() - 1; totals[k] += t.amount; cnts[k]++; } });
    var now = new Date();
    var todayIdx = sameMonth(state.month, now) ? now.getDate() - 1 : -1;
    var W = Math.max(260, Math.round(host.clientWidth || 320));
    var H = 140, padL = 48, padR = 2, padT = 10, axisH = 22;
    var plotW = W - padL - padR, plotH = H - padT - axisH;
    var max = niceMax(Math.max.apply(null, totals.concat([0])));
    var band = plotW / days;
    var bw = Math.max(2, Math.min(24, band - 2));
    var base = padT + plotH;
    var y = function (v) { return base - Math.max(0, v) / max * plotH; };
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" tabindex="0" role="img" aria-label="Dépenses par jour, ' + esc(dfMonth.format(state.month)) + '. Flèches gauche et droite pour lire chaque jour.">';
    [max, max / 2].forEach(function (v) {
      var yy = Math.round(y(v)) + 0.5;
      s += '<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '"/>' +
        '<text class="tick" x="' + (padL - 8) + '" y="' + yy + '" text-anchor="end" dominant-baseline="middle">' + esc(moneyCompact(v, cur)) + '</text>';
    });
    s += '<line class="axis" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (base + 0.5) + '" y2="' + (base + 0.5) + '"/>' +
      '<text class="tick" x="' + (padL - 8) + '" y="' + base + '" text-anchor="end" dominant-baseline="middle">0</text>';
    s += '<line class="cursor" id="cursor" x1="0" x2="0" y1="' + padT + '" y2="' + base + '" visibility="hidden"/>';
    totals.forEach(function (v, i) {
      if (v <= 0) return;
      var x = padL + i * band + (band - bw) / 2;
      var top = y(v);
      s += '<path class="bar" data-i="' + i + '" d="' + barPath(+x.toFixed(2), +top.toFixed(2), +bw.toFixed(2), +(base - top).toFixed(2), 4) + '"/>';
    });
    var labels = [1, 8, 15, 22, 29].filter(function (d) { return d <= days; });
    labels.forEach(function (d) {
      s += '<text class="tick' + (d - 1 === todayIdx ? ' today' : '') + '" x="' + (padL + (d - 0.5) * band).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + d + '</text>';
    });
    if (todayIdx >= 0 && labels.indexOf(todayIdx + 1) < 0) {
      s += '<text class="tick today" x="' + (padL + (todayIdx + 0.5) * band).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + (todayIdx + 1) + '</text>';
    }
    s += '</svg><div class="tip" id="tip" hidden></div>';
    host.innerHTML = s;

    var svg = host.querySelector('svg');
    var tip = $('#tip', host);
    var cursor = $('#cursor', host);
    var sel = -1;
    function show(i) {
      sel = i;
      var x = padL + (i + 0.5) * band;
      cursor.setAttribute('x1', x); cursor.setAttribute('x2', x); cursor.setAttribute('visibility', 'visible');
      host.querySelectorAll('.bar').forEach(function (b) { b.classList.toggle('dim', +b.dataset.i !== i); });
      var d = new Date(state.month.getFullYear(), state.month.getMonth(), i + 1);
      tip.innerHTML = '';
      var b = document.createElement('b');
      b.textContent = totals[i] > 0 ? money(totals[i], cur) : 'Rien dépensé';
      var span = document.createElement('span');
      span.textContent = dfDay.format(d) + (cnts[i] ? ' · ' + plural(cnts[i], 'transaction') : '');
      tip.appendChild(b); tip.appendChild(span);
      tip.hidden = false;
      var tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(x, tw / 2), W - tw / 2) + 'px';
      tip.style.top = Math.max(y(totals[i]) - 8, 34) + 'px';
    }
    function hide() {
      sel = -1;
      tip.hidden = true;
      cursor.setAttribute('visibility', 'hidden');
      host.querySelectorAll('.bar').forEach(function (b) { b.classList.remove('dim'); });
    }
    function idxAt(ev) {
      var r = svg.getBoundingClientRect();
      var i = Math.floor((ev.clientX - r.left - padL) / band);
      return i >= 0 && i < days ? i : -1;
    }
    svg.addEventListener('pointermove', function (ev) { var i = idxAt(ev); if (i >= 0) show(i); else hide(); });
    svg.addEventListener('pointerdown', function (ev) { var i = idxAt(ev); if (i >= 0) show(i); });
    svg.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') hide(); });
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', function (ev) {
      var last = todayIdx >= 0 ? todayIdx : days - 1;
      if (ev.key === 'ArrowRight') { show(sel < 0 ? 0 : Math.min(last, sel + 1)); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { show(sel < 0 ? last : Math.max(0, sel - 1)); ev.preventDefault(); }
      else if (ev.key === 'Escape') hide();
    });

    var rows = '';
    for (var k = days - 1; k >= 0; k--) {
      if (totals[k] > 0) rows += '<tr><td>' + esc(dfDay.format(new Date(state.month.getFullYear(), state.month.getMonth(), k + 1))) + '</td><td class="num">' + cnts[k] + '</td><td class="num">' + esc(money(totals[k], cur)) + '</td></tr>';
    }
    $('#dailyTable').innerHTML = rows
      ? '<details class="table-view"><summary>Voir en tableau</summary><table><thead><tr><th>Jour</th><th class="num">Transactions</th><th class="num">Dépensé</th></tr></thead><tbody>' + rows + '</tbody></table></details>'
      : '<p class="empty" style="padding:8px 0 0">Aucune dépense ce mois-ci pour l’instant.</p>';
  }

  function renderCats(mt, cur) {
    var map = {};
    mt.forEach(function (t) {
      if (!counts(t) || t.currency !== cur) return;
      var c = t.category || 'Other';
      map[c] = map[c] || { name: c, total: 0, n: 0 };
      map[c].total += t.amount;
      map[c].n++;
    });
    var rows = Object.keys(map).map(function (k) { return map[k]; }).filter(function (e) { return Math.abs(e.total) >= 0.005; }).sort(function (a, b) { return b.total - a.total; });
    var sum = rows.reduce(function (s, e) { return s + Math.max(0, e.total); }, 0);
    var max = rows.length ? Math.max(rows[0].total, 0) : 0;
    $('#cats').innerHTML = rows.length ? rows.map(function (e) {
      var ratio = max > 0 ? Math.max(0, e.total) / max : 0;
      var pct = sum > 0 ? Math.round(Math.max(0, e.total) / sum * 100) : 0;
      return '<button class="cat' + (state.cat === e.name ? ' on' : '') + '" data-cat="' + esc(e.name) + '" aria-pressed="' + (state.cat === e.name) + '" aria-label="' +
        esc(catLabel(e.name) + ' : ' + money(e.total, cur) + ', ' + pct + ' % des dépenses, ' + plural(e.n, 'transaction') + '. Les afficher') + '">' +
        '<span class="cat-name">' + (ICONS[e.name] || '🏷️') + ' ' + esc(catLabel(e.name)) + '</span>' +
        '<span class="cat-track"><span class="cat-bar" style="width:calc((100% - 7.2em) * ' + ratio.toFixed(4) + ')"></span>' +
        '<span class="cat-val">' + esc(money(e.total, cur)) + ' <span class="cat-pct">' + pct + ' %</span></span></span></button>';
    }).join('') : '<p class="empty">Les catégories apparaissent avec les premières dépenses.</p>';
  }

  function renderInsights(mt, cur) {
    var box = $('#insights');
    if (!I) return;
    var now = new Date();
    var all = state.data.transactions;
    var rec = I.recurring(all, now, { currency: cur });
    var flagged = mt.filter(function (t) { return counts(t) && t.currency === cur && /large|new/.test(t.flags || ''); });
    var summary = I.monthSummary(all, cur, state.month.getFullYear(), state.month.getMonth(), now);
    var parts = [];
    if (rec.length) {
      parts.push('<h2>Abonnements et factures <span class="pill">' + esc(money(I.monthlyTotal(rec), cur)) + ' par mois</span></h2><div class="kv">' + rec.slice(0, 6).map(function (r) {
        var note = r.increased ? '<span class="up">▲ ' + esc(money(r.increased.from, cur)) + ' → ' + esc(money(r.increased.to, cur)) + '</span>'
          : r.overdue ? '<span class="muted">attendu vers le ' + esc(I.formatDate(r.nextExpected, 'fr')) + ', pas encore reçu</span>'
          : '<span class="muted">' + { weekly: 'chaque semaine', monthly: 'chaque mois', yearly: 'chaque année' }[r.period] + ' · prochain vers le ' + esc(I.formatDate(r.nextExpected, 'fr')) + '</span>';
        return '<div class="line"><span>' + esc(r.merchant) + '</span><b>' + esc(money(r.amount, cur)) + '</b></div><div class="line" style="margin-top:-4px">' + note + '</div>';
      }).join('') + '</div>');
    }
    if (flagged.length) {
      parts.push('<h2 style="margin-top:' + (parts.length ? 16 : 0) + 'px">Achats inhabituels</h2><div class="kv">' + flagged.slice(0, 5).map(function (t) {
        return '<div class="line"><span>' + esc(t.merchant || '?') + (/new/.test(t.flags) ? '<span class="pill">nouveau</span>' : '') + (/large/.test(t.flags) ? '<span class="pill warn">gros achat</span>' : '') + '</span><b>' + esc(money(Math.abs(t.amount), cur)) + '</b></div>';
      }).join('') + '</div>');
    }
    if (summary.topMerchants.length >= 2) {
      parts.push('<h2 style="margin-top:' + (parts.length ? 16 : 0) + 'px">Où va l’argent</h2><div class="kv">' + summary.topMerchants.map(function (m) {
        return '<div class="line"><span>' + esc(m.merchant) + ' <span class="muted">· ' + m.count + ' fois</span></span><b>' + esc(money(m.total, cur)) + '</b></div>';
      }).join('') + '</div>');
    }
    if (!parts.length) return;
    box.hidden = false;
    box.innerHTML = parts.join('');
  }

  function txMatches(t, q) {
    return P.fold([t.merchant, catLabel(t.category), t.card, t.note, t.raw, money(Math.abs(t.amount), t.currency)].join(' ')).indexOf(q) >= 0;
  }

  function renderList(mt, cur) {
    var reviewAll = state.data.transactions.filter(function (t) { return t.status === 'review'; }).length;
    var ign = state.data.ignored.filter(function (x) { return inMonth(x._d, state.month); });
    $('#listHead').innerHTML =
      '<div class="seg" role="tablist" aria-label="Afficher">' +
      seg('all', 'Tout') + seg('review', 'À vérifier' + (reviewAll ? ' (' + reviewAll + ')' : '')) + seg('ignored', 'Ignorées' + (ign.length ? ' (' + ign.length + ')' : '')) +
      '</div><input class="search" id="q" type="search" placeholder="Rechercher" aria-label="Rechercher une transaction" value="' + esc(state.q) + '">';
    renderListBody(mt, cur, ign);
  }

  function renderListBody(mt, cur, ign) {
    if (!ign) ign = state.data.ignored.filter(function (x) { return inMonth(x._d, state.month); });
    $('#chipRow').innerHTML = state.cat && state.view !== 'ignored'
      ? '<button class="chip" data-act="clear-cat" aria-label="Ne plus filtrer par ' + esc(catLabel(state.cat)) + '"><span>Catégorie :</span> ' + esc(catLabel(state.cat)) + ' ✕</button>' : '';
    var q = P.fold(state.q.trim());
    var list = $('#list');

    if (state.view === 'ignored') {
      var items = q ? ign.filter(function (x) { return P.fold(x.raw + ' ' + x.reason + ' ' + x.source).indexOf(q) >= 0; }) : ign;
      list.innerHTML = (items.length ? items.map(function (x) {
        return '<div class="row muted" style="grid-template-columns:1fr auto">' +
          '<div class="main"><div class="meta">' + esc(reasonLabel(x.reason) + ' · ' + sourceLabel(x.source) + (x._d ? ' · ' + dfDay.format(x._d) + ' ' + dfTime.format(x._d) : '')) + '</div>' +
          '<div class="raw">' + esc(x.raw) + '</div></div>' +
          (x.reason === 'raccourci' || x.reason === 'rate-limit' || !x.raw ? '' : '<button class="btn small" data-act="promote" data-i="' + state.data.ignored.indexOf(x) + '">Ajouter</button>') + '</div>';
      }).join('') : '<p class="empty">Les notifications qui ne sont pas des transactions (codes, promotions, soldes) sont listées ici, pour vérifier que rien n’a été manqué.</p>') +
        (ign.length ? '<div class="btns" style="margin-top:12px"><button class="btn small" data-act="copy-ignored">Copier pour améliorer la lecture</button></div>' : '');
      return;
    }

    var tx = state.view === 'review'
      ? state.data.transactions.filter(function (t) { return t.status === 'review' && (!q || txMatches(t, q)); })
      : mt.filter(function (t) { return (!state.cat || t.category === state.cat) && (!q || txMatches(t, q)); });
    if (!tx.length) {
      list.innerHTML = '<p class="empty">' + (state.view === 'review' ? 'Rien à vérifier.' : q || state.cat ? 'Aucune transaction correspondante.' : 'Aucune transaction ce mois-ci pour l’instant. Elles apparaissent ici à mesure que les notifications arrivent.') + '</p>';
      return;
    }
    var html = '';
    var current = '';
    var dayTotals = {};
    tx.forEach(function (t) { var k = dayKey(t._d); if (counts(t) && t.currency === cur) dayTotals[k] = (dayTotals[k] || 0) + t.amount; });
    tx.forEach(function (t) {
      var k = dayKey(t._d);
      if (k !== current) {
        current = k;
        html += '<div class="day"><span>' + esc(dayLabel(t._d)) + '</span><span>' + (dayTotals[k] ? esc(money(dayTotals[k], cur)) : '') + '</span></div>';
      }
      html += rowHtml(t);
    });
    list.innerHTML = html;
  }
  function seg(v, label) { return '<button role="tab" data-view="' + v + '" aria-selected="' + (state.view === v) + '">' + esc(label) + '</button>'; }
  function rowHtml(t) {
    var isCounted = counts(t);
    var cls = 'row' + (isCounted ? '' : ' muted') + (t.status === 'duplicate' ? ' dup' : '');
    var badges = '';
    if (t.status === 'review') badges += '<span class="badge warn">⚠ À vérifier</span>';
    if (t.status === 'duplicate') badges += '<span class="badge">Doublon ?</span>';
    if (t.status === 'excluded') badges += '<span class="badge">Non comptée</span>';
    if (/large/.test(t.flags || '')) badges += '<span class="badge warn">Gros achat</span>';
    var meta = [catLabel(t.category), t.card, dfTime.format(t._d), /^(email|statement|paste|manual)/.test(t.source) ? sourceLabel(t.source) : ''].filter(Boolean).join(' · ');
    var sign = t.amount < 0 ? '+' : '';
    var name = t.merchant || { transfer: 'Virement', income: 'Revenu', cash: 'Retrait', fee: 'Frais bancaires' }[t.type] || 'Marchand inconnu';
    var note = t.type !== 'purchase' && t.merchant ? TYPE_LABEL[t.type] : '';
    return '<button class="' + cls + '" data-id="' + esc(t.id) + '">' +
      '<span class="ico" aria-hidden="true">' + (ICONS[t.category] || '🏷️') + '</span>' +
      '<span class="main"><span class="name" style="display:block">' + esc(name) + badges + '</span><span class="meta" style="display:block">' + esc(meta) + '</span></span>' +
      '<span class="amt"><span>' + sign + esc(money(Math.abs(t.amount), t.currency)) + '</span>' + (note ? '<small>' + esc(note) + '</small>' : '') + '</span></button>';
  }

  function renderFoot() {
    var parts = [];
    var h = state.data.health || {};
    if (live()) {
      parts.push(state.lastSync ? 'Synchronisé ' + ago(state.lastSync) : 'Pas encore synchronisé');
      if (h.lastPhoneAt) parts.push('iPhone : ' + ago(h.lastPhoneAt));

  /* ------------------------------------------------------------ feuilles (dialogues) */

  var dialog = $('#sheet');
  var sheetBody = $('#sheetBody');
  function openSheet(html, init) {
    sheetBody.innerHTML = html;
    if (!dialog.open) dialog.showModal();
    sheetBody.scrollTop = 0;
    if (init) init(sheetBody);
  }
  function closeSheet() { if (dialog.open) dialog.close(); }
  dialog.addEventListener('click', function (ev) { if (ev.target === dialog) closeSheet(); });

  function allCategories() {
    var names = P.CATEGORIES.map(function (c) { return c.name; });
    state.data.rules.forEach(function (r) { if (r.category && names.indexOf(r.category) < 0 && !/^\(/.test(r.category)) names.push(r.category); });
    state.data.transactions.forEach(function (t) { if (t.category && names.indexOf(t.category) < 0) names.push(t.category); });
    return names;
  }
  function options(list, selected, labelFn) {
    return list.map(function (v) { return '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(labelFn ? labelFn(v) : v) + '</option>'; }).join('');
  }
  function ruleCount(merchant, category) {
    var fm = P.fold(merchant);
    return state.data.transactions.filter(function (x) { return (x.type === 'purchase' || x.type === 'refund') && x.category !== category && P.matchRule(P.fold(x.merchant), merchant) && fm; }).length;
  }

  function openEdit(t) {
    var cats = allCategories();
    if (cats.indexOf(t.category) < 0) cats.unshift(t.category);
    var counted = t.status !== 'excluded' && t.status !== 'duplicate';
    var foreign = t.currency !== mainCurrency();
    openSheet(
      '<h2 id="sheetTitle">Modifier</h2>' +
      (t.status === 'review' ? '<p class="hint" style="margin:-6px 0 14px">⚠ ' + esc(t.note || 'La notification était difficile à lire. Vérifiez, puis enregistrez.') + '</p>' : '') +
      (t.status === 'duplicate' ? '<p class="hint" style="margin:-6px 0 14px">' + esc(t.note || 'Doublon probable') + '. Non comptée.</p>' : '') +
      '<label class="field"><span>Marchand</span><input id="fMerchant" value="' + esc(t.merchant) + '" autocomplete="off"></label>' +
      '<div class="two"><label class="field"><span>Montant</span><input id="fAmount" type="number" inputmode="decimal" step="0.01" min="0" value="' + Math.abs(t.amount).toFixed(2) + '"></label>' +
      '<label class="field"><span>Catégorie</span><select id="fCategory">' + options(cats, t.category, catLabel) + '<option value="__new">Nouvelle catégorie…</option></select></label></div>' +
      '<div class="two"><label class="field"><span>Type</span><select id="fType">' + options(P.TYPES, t.type, function (v) { return TYPE_LABEL[v]; }) + '</select></label>' +
      '<label class="field"><span>Date</span><input id="fDate" type="datetime-local" value="' + toLocalInput(t._d) + '"></label></div>' +
      (foreign ? '<label class="field"><span>Devise</span><input id="fCurrency" value="' + esc(t.currency) + '" maxlength="3" autocapitalize="characters"></label>' : '') +
      '<label class="field"><span>Note</span><input id="fNote" value="' + esc(t.note) + '"></label>' +
      '<label class="check"><input type="checkbox" id="fCount"' + (counted ? ' checked' : '') + '><span>Compter dans mes dépenses</span></label>' +
      '<label class="check"><input type="checkbox" id="fRule"><span id="fRuleLabel"></span></label>' +
      '<label class="check" id="fIgnoreRow" hidden><input type="checkbox" id="fIgnore"><span>Ne jamais compter ce marchand (règle « ignorer »)</span></label>' +
      (t.raw ? '<p class="hint" style="margin:0 0 14px">Texte reçu (' + esc(sourceLabel(t.source)) + ') : <span class="mono">' + esc(t.raw) + '</span></p>' : '') +
      '<div class="btns"><button class="btn danger" data-sheet="delete">Supprimer</button><span class="spacer"></span>' +
      '<button class="btn" data-sheet="cancel">Annuler</button><button class="btn primary" data-sheet="save">Enregistrer</button></div>',
      function (root) {
        var cat = $('#fCategory', root);
        var merchantIn = $('#fMerchant', root);
        var rule = $('#fRule', root);
        var ruleLabel = function () {
          var m = merchantIn.value.trim();
          var c = cat.value === '__new' ? t.category : cat.value;
          var n = m ? ruleCount(m, c) : 0;
          $('#fRuleLabel', root).textContent = m ? 'Toujours classer « ' + m + ' » dans ' + catLabel(c) + (n ? ' (et ' + plural(n, 'autre achat') + ')' : '') : 'Toujours utiliser cette catégorie pour ce marchand';
        };
        cat.addEventListener('change', function () {
          if (cat.value === '__new') {
            var name = (prompt('Nom de la nouvelle catégorie') || '').trim();
            if (name) { var o = document.createElement('option'); o.value = name; o.textContent = name; cat.insertBefore(o, cat.lastElementChild); cat.value = name; }

  function addManual(f) {

  function tempTx(r, date, source, raw) {
    return hydrate({ id: 'local-' + Date.now() + Math.random(), date: date.toISOString(), amount: P.signedAmount(r.amount, r.type), currency: r.currency, merchant: r.merchant,
      category: r.category, type: r.type, card: r.card || '', status: r.status === 'review' ? 'review' : 'ok', note: '', source: source, raw: raw, flags: '' });
  }

  // Relevé : chaque ligne doit avoir une date, un montant et une description. Les paiements de carte,
  // remboursements et dépôts (colonne Crédit, ou mots-clés) ne sont jamais proposés comme des achats.
  var CREDIT_WORDS = /\b(paiement|payment|merci|thank you|rembours\w*|refund|retour|cr[ée]dit|d[ée]p[oô]t|deposit|virement|transfer\w*|int[ée]r[êe]ts?|interest|reversal|annulation)\b/i;
  var NUM_CELL = /^[-+(]?\s*\$?\s*(?:\d{1,3}(?:[ ,.]\d{3})+|\d+)(?:[.,]\d{1,2})?\s*\$?\s*\)?\s*(?:CR|DR|DB)?$/i;
  function splitCells(line) {
    var cells = line.indexOf('\t') >= 0 ? line.split('\t') : line.indexOf(';') >= 0 ? line.split(';') : line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    return cells.map(function (c) { return c.replace(/^"|"$/g, '').trim(); });
  }
  function parseNumCell(c) {
    var negative = /^-|^\(|\)$|\bDR\b|\bDB\b/i.test(c) && !/\bCR\b/i.test(c);
    var credit = /\bCR\b/i.test(c);
    var v = P.toNumber(c.replace(/[^\d.,\s]/g, '').trim());
    return isFinite(v) && v > 0 ? { value: v, negative: negative, credit: credit } : null;
  }
  function parseStatement(text) {
    var lines = String(text || '').split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (!lines.length) return [];
    // En-tête : colonnes Débit / Crédit / Montant / Date / Description.
    var head = splitCells(lines[0]).map(function (c) { return P.fold(c); });
    var cols = { debit: -1, credit: -1, amount: -1, date: -1, desc: -1 };
    var hasHeader = !head.some(function (c) { return NUM_CELL.test(c); }) && head.some(function (c) { return /date|montant|amount|debit|credit|description|libell/.test(c); });
    if (hasHeader) {
      head.forEach(function (c, i) {
        if (cols.debit < 0 && /^debit/.test(c)) cols.debit = i;
        else if (cols.credit < 0 && /^credit/.test(c)) cols.credit = i;
        else if (cols.amount < 0 && /montant|amount|somme/.test(c)) cols.amount = i;
        else if (cols.date < 0 && /date/.test(c)) cols.date = i;
        else if (cols.desc < 0 && /description|libell|marchand|merchant|detail|transaction|nom|name/.test(c)) cols.desc = i;
      });
      lines = lines.slice(1);
    }
    // Ordre des dates a/b/aaaa : jour-mois si un premier nombre dépasse 12, mois-jour si un deuxième dépasse 12.
    var dayFirst = null;
    lines.forEach(function (line) {
      splitCells(line).forEach(function (c) {
        var m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(c);
        if (!m) return;
        if (+m[1] > 12) dayFirst = true;
        else if (+m[2] > 12 && dayFirst === null) dayFirst = false;
      });
    });
    if (dayFirst === null) dayFirst = false; // relevés canadiens : mois/jour/année le plus souvent
    var today = new Date();
    var out = [];
    lines.forEach(function (line) {
      var cells = splitCells(line);
      var date = null;
      var amount = null;
      var credit = false;
      var desc = [];
      cells.forEach(function (c, i) {
        if (!c) return;
        if (i === cols.desc) { desc.push(c); return; }
        var dm = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(c);
        var dm2 = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(c);
        if ((dm || dm2) && !date && (cols.date < 0 || i === cols.date)) {
          date = dm ? new Date(+dm[1], +dm[2] - 1, +dm[3]) : dayFirst ? new Date(+dm2[3], +dm2[2] - 1, +dm2[1]) : new Date(+dm2[3], +dm2[1] - 1, +dm2[2]);
          return;
        }
        if (NUM_CELL.test(c)) {
          var n = parseNumCell(c);
          if (!n) return;
          if (i === cols.credit) { if (amount === null) { amount = n.value; credit = true; } return; }
          if (i === cols.debit) { if (amount === null) amount = n.value; return; }
          if (cols.amount >= 0 && i !== cols.amount) return;
          if (amount === null) { amount = n.value; credit = n.credit; }
          return;
        }
        if (/[A-Za-zÀ-ÿ]{2,}/.test(c)) desc.push(c);
      });
      if (!date || isNaN(date) || !amount) return;
      if (date > new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1) || date < new Date(today.getFullYear() - 2, today.getMonth(), 1)) return;
      var merchant = desc.join(' ').replace(/\s+/g, ' ').trim().slice(0, 60);
      if (CREDIT_WORDS.test(merchant)) credit = true;
      out.push({ date: date, amount: amount, merchant: merchant, credit: credit, kind: credit ? (/rembours|refund|retour|reversal|annulation/i.test(merchant) ? 'refund' : 'transfer') : 'purchase' });
    });
    return out;
  }
  function matchStatementLine(line) {
    return state.data.transactions.some(function (t) {
      return t.status !== 'excluded' && Math.abs(Math.abs(t.amount) - line.amount) < 0.011 && Math.abs(t._d - line.date) < 4 * 86400000;
    });
  }
  function addStatementLines(lines) {
    if (!lines.length) return;
    var i = 0;
    var added = 0;
    var review = 0;
    (function next() {
      if (i >= lines.length) {
        toast(plural(added, 'transaction') + (added > 1 ? ' ajoutées' : ' ajoutée') + (review ? ' · ' + review + ' à vérifier (doublon possible)' : ''));
        return sync(true);
      }
      var l = lines[i++];
      var f = { amount: l.amount, currency: mainCurrency(), merchant: l.merchant, type: l.kind, date: new Date(l.date.getFullYear(), l.date.getMonth(), l.date.getDate(), 12).toISOString(), source: 'statement' };
      if (!live()) { replaceTx(tempTx(P.fromFields(f, { defaultCurrency: mainCurrency(), rules: state.data.rules }), new Date(f.date), 'statement', '')); added++; persist(); render(); return next(); }
      api('add', { tx: f }).then(function (res) { replaceTx(res.tx); if (res.status === 'review') review++; else added++; render(); }).catch(function (e) { toast('Non ajoutée : ' + e.message); }).then(next);
    })();
  }
