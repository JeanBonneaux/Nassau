      '<div class="btns" style="margin-top:14px">' + (s.demo ? '<button class="btn" data-sheet="leave-demo">Quitter les exemples</button>' : '') + '<span class="spacer"></span><button class="btn" data-sheet="cancel">Annuler</button><button class="btn primary" data-sheet="save">Enregistrer</button></div>',
      function (root) {
        if (connected() && !standalone && !isIOS && typeof SpendQR !== 'undefined') {
          try { $('#sQr', root).innerHTML = SpendQR.svg(setupLink(), { ecl: 'M' }); } catch (e) { $('#sQr', root).textContent = 'Code QR indisponible'; }
        }
        root.oninput = function (ev) {
          if (ev.target.id !== 'sUrl') return;
          var d = decodeSetup(ev.target.value);
          if (d) { $('#sUrl', root).value = d.s.u; $('#sToken', root).value = d.s.k; toast('Lien de configuration reconnu'); }
        };
        root.onclick = function (ev) {
          var rb = ev.target.closest('[data-rule]');
          if (rb) {
            var pattern = rb.dataset.rule;
            mutate(function () { state.data.rules = state.data.rules.filter(function (r) { return r.pattern !== pattern; }); }, 'rule-delete', { pattern: pattern }, function (r) { state.data.rules = r.rules; });
            rb.parentNode.remove();
            return;
          }
          var act = ev.target.closest('[data-sheet]');
          if (!act) return;
          ev.preventDefault();
          var a = act.dataset.sheet;
          var url = $('#sUrl', root).value.trim();
          var token = $('#sToken', root).value.trim();
          if (a === 'cancel') closeSheet();
          if (a === 'copy-shortcut') copyText($('#sShortcut', root).value, $('#sShortcut', root), 'Lien du raccourci copié');
          if (a === 'copy-setup') copyText(setupLink(), null, 'Lien de configuration copié (il contient votre jeton : ne le partagez pas)');
          if (a === 'leave-demo') { state.settings.demo = false; saveSettings(); closeSheet(); loadLocal(); render(); sync(); }
          if (a === 'test') {
            var out = $('#sTest', root);
            if (!validUrl(url) || !token) { out.textContent = 'Indiquez l’adresse (https://…) et le jeton.'; return; }
            out.textContent = 'Test…';
            api('ping', {}, { url: url, token: token }).then(function (r) { out.textContent = '✓ Connecté (script ' + r.version + ', ' + r.currency + ')'; })
              .catch(function (err) { out.textContent = '✗ ' + err.message; });
          }
          if (a === 'save') {
            if (url && !validUrl(url)) { toast('L’adresse doit commencer par https://'); return; }
            var prev = state.settings;
            var next = { url: url, token: token, demo: prev.demo && !(url && token) ? true : false, hideChecklist: prev.hideChecklist };
            var sourceChanged = prev.demo !== next.demo || prev.url !== next.url || prev.token !== next.token;
            var newBudget = Math.max(0, parseFloat($('#sBudget', root).value) || 0);
            var newSettings = { budget: newBudget, digest: $('#sDigest', root).checked, email: $('#sEmail', root).checked, heartbeatDays: Math.max(1, parseInt($('#sHeartbeat', root).value, 10) || 3), currency: $('#sCurrency', root).value };
            state.settings = next;
            saveSettings();
            closeSheet();
            if (sourceChanged) { state.error = ''; loadLocal(); }
            var changed = JSON.stringify(newSettings) !== JSON.stringify({ budget: budget(), digest: srv.digest !== false, email: srv.email !== false, heartbeatDays: Number(srv.heartbeatDays) || 3, currency: mainCurrency() });
            if (changed) { state.data.settings = Object.assign({}, state.data.settings, newSettings); state.data.currency = newSettings.currency; }
            render();
            if (live()) {
              (sourceChanged ? sync() : Promise.resolve()).then(function () {
                if (changed) return api('settings', newSettings).then(function (r) { state.data.settings = r.settings; state.data.currency = r.settings.currency || state.data.currency; persist(); render(); });
              }).catch(function (err) { toast(err.message); });
            } else if (changed) persist();
            toast('Réglages enregistrés');
          }
        };
      });
  }

  /* ------------------------------------------------------------ événements */

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act],[data-view],[data-cat],[data-id]');
    if (!el || dialog.contains(el)) return;
    if (el.dataset.view) { state.view = el.dataset.view; render(); return; }
    if (el.dataset.cat !== undefined && el.classList.contains('cat')) {
      state.cat = state.cat === el.dataset.cat ? '' : el.dataset.cat;
      if (state.view === 'ignored') state.view = 'all';
      render();
      if (state.cat) $('#list').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    var act = el.dataset.act;
    if (!act && el.dataset.id) { var t = findTx(el.dataset.id); if (t) openEdit(t); return; }
    if (act === 'edit') { var te = findTx(el.dataset.id); if (te) openEdit(te); }
    if (act === 'confirm') quickStatus(el.dataset.id, 'ok', 'Confirmée');
    if (act === 'dup') quickStatus(el.dataset.id, 'duplicate', 'Marquée comme doublon (non comptée)');
    if (act === 'settings') openSettings();
    if (act === 'demo') { state.settings.demo = true; saveSettings(); loadLocal(); render(); }
    if (act === 'leave-demo') { state.settings.demo = false; saveSettings(); loadLocal(); render(); sync(); }
    if (act === 'sync') sync();
    if (act === 'clear-cat') { state.cat = ''; render(); }
    if (act === 'copy-shortcut') copyText(shortcutUrl(), null, 'Lien du raccourci copié');
    if (act === 'copy-setup') copyText(setupLink(), null, 'Lien de configuration copié (il contient votre jeton : ne le partagez pas)');
    if (act === 'copy-ignored') {
      var lines = state.data.ignored.slice(0, 20).map(function (x) { return reasonLabel(x.reason) + ' | ' + sourceLabel(x.source) + ' | ' + P.redactCodes(x.raw); });
      copyText(lines.join('\n'), null, plural(lines.length, 'notification') + (lines.length > 1 ? ' copiées' : ' copiée'));
    }
    if (act === 'promote') {
      var x = state.data.ignored[+el.dataset.i];
      if (!x) return;
      var when = x._d || new Date();
      openAdd(x.raw, when);
      // Une fois ajoutée, la ligne ignorée disparaît.
      var ignored = x;
      var done = function () { if (live()) api('unignore', { captured_at: ignored.captured_at, raw: ignored.raw }).catch(function () { /* déjà partie */ }); };
      dialog.addEventListener('close', function once() {
        dialog.removeEventListener('close', once);
        if (state.data.ignored.indexOf(ignored) >= 0 && state.data.transactions.some(function (t) { return t.raw === ignored.raw || t.source === 'paste' && Math.abs(t._d - when) < 1000; })) {
          state.data.ignored = state.data.ignored.filter(function (y) { return y !== ignored; });
          done();
          render();
        }
      });
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'q') { state.q = ev.target.value; renderListBody(monthTx(state.month), mainCurrency()); }
  });
  $('#prevMonth').addEventListener('click', function () { state.month = addMonths(state.month, -1); render(); });
  $('#nextMonth').addEventListener('click', function () { state.month = addMonths(state.month, 1); render(); });
  $('#syncBtn').addEventListener('click', function () { sync(); });
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#addBtn').addEventListener('click', function () { openAdd(''); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && live() && Date.now() - state.lastSync > 60000) sync(true);
  });
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if ($('#daily')) renderDaily(monthTx(state.month), mainCurrency()); }, 150);
  });

  var toastTimer;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  /* ------------------------------------------------------------ exemples */

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function fr$(a) { return a.toFixed(2).replace('.', ',') + ' $'; }
  // Des notifications d'exemple dans les formats de Scotia, Capital One, Wealthsimple et Cartes, lues par le même parseur que la feuille.
  function makeDemo() {
    var R = rng(20261101);
    var now = new Date();
    var start = addMonths(startOfMonth(now), -2);
    var tx = [];
    var ignored = [];
    var opts = { defaultCurrency: 'CAD' };
    var shops = [
      ['IGA EXTRA', 18, 95, 5], ['METRO PLUS', 12, 80, 4], ['CAFE OLIMPICO', 4, 9, 7], ['TIM HORTONS', 3, 8, 4],
      ['UBER *TRIP', 9, 28, 3], ['PETRO-CANADA', 35, 70, 2], ['AMAZON.CA', 15, 120, 2], ['JEAN COUTU', 8, 40, 1],
      ['CINEMA GUZZO', 14, 32, 1], ['LA BANQUISE', 22, 60, 2], ['RENAUD-BRAY', 25, 80, 0.4], ['STM', 3.75, 3.75, 3], ['SAQ', 15, 60, 1]
    ];
    var weight = shops.reduce(function (s, x) { return s + x[3]; }, 0);
    function pick() { var r = R() * weight; for (var i = 0; i < shops.length; i++) { r -= shops[i][3]; if (r <= 0) return shops[i]; } return shops[0]; }
    var formats = [
      function (m, a) { return { title: 'InfoAlerte Scotia', body: 'Un achat de ' + fr$(a) + ' a été effectué chez ' + m + ' avec votre carte Visa se terminant par 4821.' }; },
      function (m, a) { return { title: 'Visa Scotia', subtitle: m, body: fr$(a) }; },
      function (m, a) { return { title: 'Capital One', body: 'A purchase of $' + a.toFixed(2) + ' at ' + m + ' was approved on your card ending in 0937.' }; },
      function (m, a) { return { title: 'Wealthsimple', body: 'Vous avez dépensé ' + fr$(a) + ' chez ' + m }; }
    ];
    function push(n, d, flags) {
      var r = P.parse(n, opts);
      var raw = [n.title, n.subtitle, n.body].filter(Boolean).join(' | ');
      var bank = P.inferBank(n);
      if (r.kind !== 'transaction') { ignored.push({ captured_at: d.toISOString(), source: 'phone' + (bank ? ':' + bank : ''), reason: r.reason, raw: P.redactCodes(raw) }); return null; }
      var t = { id: 'demo' + tx.length, date: d.toISOString(), amount: P.signedAmount(r.amount, r.type), currency: r.currency, merchant: r.merchant,
        category: r.category, type: r.type, card: r.card, status: r.status, note: r.reason === 'hold' ? 'Préautorisation' : '', source: 'phone' + (bank ? ':' + bank : ''), raw: raw, reader: 'rules', flags: flags || '' };
      tx.push(t);
      return t;
    }
    function at(day, h, mnt) { return new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, mnt); }
    for (var day = new Date(start); day <= now; day = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1)) {
      var n = Math.floor(R() * 3.2);
      for (var i = 0; i < n; i++) {
        var s = pick();
        var amount = Math.round((s[1] + R() * (s[2] - s[1])) * 100) / 100;
        var d = at(day, 8 + Math.floor(R() * 13), Math.floor(R() * 60));
        if (d > now) continue;
        push(formats[Math.floor(R() * formats.length)](s[0], amount), d);
      }
      var dom = day.getDate();
      if (dom === 3) push({ title: 'Capital One', body: 'A purchase of $' + (day.getMonth() === now.getMonth() ? '18.99' : '16.99') + ' at NETFLIX.COM was approved on your card ending in 0937.' }, at(day, 6, 2));
      if (dom === 12) push({ title: 'InfoAlerte Scotia', body: 'Un achat de 11,99 $ a été effectué chez SPOTIFY avec votre carte Visa se terminant par 4821.' }, at(day, 7, 15));
      if (dom === 15) push({ title: 'InfoAlerte Scotia', body: 'Un paiement préautorisé de 85,00 $ à HYDRO-QUÉBEC a été effectué depuis votre compte.' }, at(day, 5, 40));
      if (dom === 20) push({ title: 'InfoAlerte Scotia', body: 'Un paiement de facture de 65,00 $ à FIZZ a été effectué depuis votre compte se terminant par 1234.' }, at(day, 9, 5));
    }
    var y = new Date(now.getFullYear(), now.getMonth(), Math.max(1, now.getDate() - 1));
    push({ title: 'Capital One', body: 'Un crédit de 24,99 $ de AMAZON.CA a été porté à votre compte.' }, at(y, 10, 12));
    push({ title: 'InfoAlerte Scotia', body: 'Un paiement de 500,00 $ a été porté à votre carte de crédit se terminant par 4821.' }, at(y, 8, 0));
    push({ title: 'Capital One', body: 'A purchase of $12.40 was approved on your card ending 0937' }, at(y, 13, 30));
    var big = push({ title: 'Capital One', body: 'A purchase of $649.00 at APPLE STORE STE-CATHERINE was approved on your card ending in 0937.' }, at(y, 15, 10), 'large,new');
    void big;
    var dupDay = new Date(now.getFullYear(), now.getMonth(), Math.max(1, now.getDate() - 2));
    push({ title: 'Visa Scotia', subtitle: 'Café Olimpico', body: '4,75 $' }, at(dupDay, 12, 4));
    var dup = push({ title: 'InfoAlerte Scotia', body: 'Un achat de 4,75 $ a été effectué chez CAFE OLIMPICO avec votre carte Visa se terminant par 4821.' }, at(dupDay, 12, 5));
    if (dup) { dup.status = 'duplicate'; dup.note = 'Doublon probable de Café Olimpico (Cartes · iPhone)'; }
    push({ title: 'Capital One', body: 'Your verification code is 482913. Do not share it.' }, at(y, 18, 2));
    push({ title: 'Wealthsimple', body: 'Gagnez 50 $ en parrainant un ami – offre à durée limitée !' }, at(y, 11, 0));
    push({ title: 'InfoAlerte Scotia', body: 'Le solde de votre compte se terminant par 1234 est inférieur à 100,00 $.' }, at(y, 7, 30));
    push({ title: 'Capital One', body: 'Your transaction of $64.00 at ELECTRO STORE was declined' }, at(dupDay, 16, 45));
    ignored.sort(function (a, b) { return b.captured_at < a.captured_at ? -1 : 1; });
    return {
      transactions: tx, ignored: ignored, rules: [{ pattern: 'cafe olimpico', category: 'Dining', name: 'Café Olimpico' }], currency: 'CAD', sheetUrl: '',
      captureToken: 'exemple', shortcutUrl: '', version: VERSION,
      settings: { budget: 1800, digest: true, email: true, heartbeatDays: 3, triggers: true },
      health: { lastPhoneAt: new Date(now.getTime() - 3 * 3600000).toISOString(), lastEmailAt: new Date(now.getTime() - 20 * 3600000).toISOString(), shortcutPingAt: start.toISOString(), bySource: {}, staleHits: 0, emailOnly7d: 0, claude: { on: false } }
    };
  }

  /* ------------------------------------------------------------ icône de l'écran d'accueil */

  (function icon() {
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 180;
      var g = c.getContext('2d');
      var grad = g.createLinearGradient(0, 0, 180, 180);
      grad.addColorStop(0, '#3987e5'); grad.addColorStop(1, '#1c5cab');
      g.fillStyle = grad; g.fillRect(0, 0, 180, 180);
      g.fillStyle = 'rgba(255,255,255,.95)';
      [[42, 96, 34], [73, 70, 60], [104, 108, 22], [135, 52, 78]].forEach(function (b) {
        var x = b[0], h = b[2], top = 140 - h, w = 22, r = 6;
        g.beginPath(); g.moveTo(x, 140); g.lineTo(x, top + r); g.quadraticCurveTo(x, top, x + r, top); g.lineTo(x + w - r, top);
        g.quadraticCurveTo(x + w, top, x + w, top + r); g.lineTo(x + w, 140); g.closePath(); g.fill();
      });
      var link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    } catch (e) { /* pas de canvas */ }
  })();

  /* ------------------------------------------------------------ démarrage */

  applySetupHash();
  loadLocal();
  render();
  if (live()) sync(true);
  window.__depenses = { state: state, render: render, sync: sync, parseStatement: parseStatement };
})();
</script>
